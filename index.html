
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>카지노</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="page">
    <header class="hero">
      <div class="eyebrow">FESTIVAL GAME ZONE</div>
      <h1 id="siteTitle">카지노</h1>
      <p id="siteSubtitle">원하는 게임을 선택해 도전해 보세요!</p>
    </header>

    <section class="guide-section">
      <div class="section-eyebrow">GAME GUIDE</div>
      <h2>게임 설명</h2>
      <p class="section-description">
        버튼을 누르면 각 게임의 설명을 확인할 수 있어요.
      </p>
      <div class="description-grid" id="descriptionGrid"></div>
    </section>

    <section class="games-section">
      <div class="games-heading">
        <div>
          <div class="section-eyebrow">MINI GAMES</div>
          <h2>미니게임</h2>
        </div>
        <span class="zone-label">GAME ZONE</span>
      </div>

      <div class="mini-game-grid" id="miniGameGrid"></div>
    </section>

    <a class="lotto-link" href="lotto.html">
      <span class="lotto-icon">🎱</span>
      <span class="lotto-info">
        <strong>로또 추첨</strong>
        <small>1부터 45까지, 행운의 번호 6개를 뽑아보세요.</small>
      </span>
      <span class="lotto-arrow">›</span>
    </a>

    <footer id="siteFooter">ENJOY THE FESTIVAL</footer>
  </main>

  <div class="modal" id="infoModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="section-eyebrow">GAME INFORMATION</div>
      <h2 id="modalTitle">게임 설명</h2>
      <p id="modalDescription"></p>
      <button id="modalClose" class="close-button" type="button">
        닫기
      </button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

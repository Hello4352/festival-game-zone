
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>NEON SHOOTER | 카지노</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px 12px;background:radial-gradient(ellipse at top,#20234c,#080b18 70%);color:#eaf5ff;font-family:Arial,"Noto Sans KR",sans-serif;text-align:center}
.container{width:100%;max-width:650px;margin:auto;padding:22px;border:1px solid #394a80;border-radius:22px;background:rgba(8,13,32,.92);box-shadow:0 0 35px #3964ff20}
.eyebrow{color:#69eaff;font-size:12px;font-weight:bold;letter-spacing:4px}
h1{margin:12px 0 5px;font-size:34px;color:white;text-shadow:0 0 15px #398cff}
.description{color:#a8b5d5;font-size:14px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0 12px}
.hud-box{padding:10px 4px;border:1px solid #354879;border-radius:10px;background:#111a35}
.hud-box small{display:block;color:#8fa6d3;font-size:11px;margin-bottom:5px}
.hud-box strong{color:#65eaff;font-size:19px}
.game-wrap{position:relative;overflow:hidden;width:100%;border:1px solid #405a9c;border-radius:14px;background:#070b19}
canvas{display:block;width:100%;height:auto;touch-action:none}
.message{min-height:25px;margin:13px 0;color:#75eaff;font-size:14px;font-weight:bold}
button{margin:5px;padding:12px 22px;border:1px solid #57dfff;border-radius:30px;background:#142448;color:white;font-size:15px;font-weight:bold;cursor:pointer}
button:hover{background:#24528b}
button:disabled{opacity:.5;cursor:not-allowed}
.back{display:inline-block;margin-top:18px;color:#9eaccb;text-decoration:none;font-size:14px}
.leaderboard{margin-top:22px;padding:15px;border:1px solid #354879;border-radius:14px;background:#101a34;text-align:left}
.leaderboard h2{margin:0 0 12px;color:#75eaff;text-align:center;font-size:18px}
.rank-row{display:grid;grid-template-columns:42px 1fr auto;gap:8px;padding:9px 5px;border-bottom:1px solid #82a0dc26;color:#dce8ff;font-size:14px}
.rank-row:last-child{border-bottom:0}
.rank-number{color:#ffd875;font-weight:bold}
.rank-score{color:#69eaff;font-weight:bold}
.overlay{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:14px;background:#040817e8;backdrop-filter:blur(5px);overflow-y:auto}
.overlay.show{display:flex}
.panel{width:100%;max-width:410px;padding:18px;border:1px solid #4a77c9;border-radius:17px;background:#101a36;box-shadow:0 0 25px #3282ff33}
.panel h2{margin:0 0 8px;color:#75eaff;font-size:23px}
.panel p{color:#b8c8e8;font-size:13px;line-height:1.5}
.upgrade-list{display:grid;gap:9px;margin-top:14px}
.upgrade-card{width:100%;margin:0;padding:13px;border:1px solid #3d72b9;border-radius:12px;background:#14264b;text-align:left}
.upgrade-card strong{display:block;margin-bottom:5px;color:#ffe18b}
.upgrade-card span{color:#c2d4f5;font-size:12px;font-weight:normal}
.ship-list{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}
.ship-card{margin:0;padding:12px 5px;border:1px solid #3d72b9;border-radius:12px;background:#14264b;font-size:12px}
.ship-card.selected{border:2px solid #69eaff;background:#1b3766;box-shadow:0 0 13px #43dfff55}
.ship-card strong{display:block;margin-bottom:7px;color:#ffe18b;font-size:13px}
.ship-icon{display:block;margin:5px;font-size:25px}
.name-input{width:100%;margin:10px 0;padding:12px;border:1px solid #4d6a9f;border-radius:9px;background:#080f25;color:white;font-size:16px;text-align:center}
.boss-bar-wrap{display:none;margin:0 0 10px;padding:8px;border:1px solid #733e77;border-radius:9px;background:#1b1029}
.boss-bar-wrap.show{display:block}
.boss-bar-title{margin-bottom:6px;color:#ff8bd9;font-size:12px;font-weight:bold}
.boss-bar{height:9px;overflow:hidden;border-radius:10px;background:#39223e}
.boss-bar-fill{width:100%;height:100%;background:linear-gradient(90deg,#ff3d9b,#ff875c);transition:width .12s}
@media(max-width:390px){.container{padding:15px 10px}h1{font-size:29px}.hud-box strong{font-size:17px}button{padding:11px 16px}}
</style>
</head>
<body>
<div class="container">
  <div class="eyebrow">CASINO MINI GAME 06</div>
  <h1>NEON SHOOTER</h1>
  <p class="description">적을 격파하고 강화하여 보스를 쓰러뜨리세요!</p>

  <div class="hud">
    <div class="hud-box"><small>SCORE</small><strong id="score">0</strong></div>
    <div class="hud-box"><small>LIVES</small><strong id="lives">3</strong></div>
    <div class="hud-box"><small>SHIELD</small><strong id="shield">0</strong></div>
  </div>

  <div class="boss-bar-wrap" id="bossBarWrap">
    <div class="boss-bar-title">BOSS HP</div>
    <div class="boss-bar"><div class="boss-bar-fill" id="bossBarFill"></div></div>
  </div>

  <div class="game-wrap">
    <canvas id="game" width="420" height="620"></canvas>

    <div class="overlay show" id="startOverlay">
      <div class="panel">
        <h2>NEON SHOOTER</h2>
        <p>적의 공격을 피하고 강화 아이템을 선택해 보스를 격파하세요.</p>
        <p>화면을 드래그하면 우주선이 이동하며 자동으로 공격합니다.</p>
        <button id="playButton">게임 시작</button>
      </div>
    </div>

    <div class="overlay" id="upgradeOverlay">
      <div class="panel">
        <h2>LEVEL UP!</h2>
        <p>원하는 강화 하나를 선택하세요.</p>
        <div class="upgrade-list" id="upgradeList"></div>
      </div>
    </div>

    <div class="overlay" id="gameOverOverlay">
      <div class="panel">
        <h2>GAME OVER</h2>
        <p id="finalScore">최종 점수: 0</p>
        <p>랭킹에 기록할 이름을 입력하세요.</p>
        <input class="name-input" id="playerName" maxlength="10" placeholder="PLAYER">
        <button id="saveButton">점수 저장</button>
        <button id="retryButton">다시 도전</button>
      </div>
    </div>
  </div>

  <div class="message" id="message">게임을 시작하고 적을 격파하세요!</div>
  <button id="mainButton">게임 시작</button>

  <div class="leaderboard">
    <h2>🏆 TOP 5 RANKING</h2>
    <div id="rankingList"></div>
  </div>
  <a class="back" href="../index.html">← 카지노 메인으로 돌아가기</a>
</div>

<script>
(() => {
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
const W=canvas.width,H=canvas.height;

const scoreText=$("score"),livesText=$("lives"),shieldText=$("shield");
const message=$("message");
const startOverlay=$("startOverlay");
const upgradeOverlay=$("upgradeOverlay");
const gameOverOverlay=$("gameOverOverlay");
const bossBarWrap=$("bossBarWrap");
const bossBarFill=$("bossBarFill");
const mainButton=$("mainButton");

let state="menu",animationId=null,lastTime=0;
let score=0,elapsed=0,nextUpgrade=25,nextBoss=60;
let player=null,bullets=[],enemies=[],particles=[],enemyBullets=[],bossBullets=[],missiles=[],pets=[],boss=null,stars=[];
let pointerDown=false,pointerX=W/2,pointerY=H-90,firing=false,fireCooldown=0;
let enemySpawnTimer=0,petTimer=0,laserTimer=0;

let upgrades={spread:1,damage:1,pet:0,shield:0,rapid:0,laser:0,pierce:0,side:0,move:0,petPower:0};

const RANKING_KEY="neonShooterTop5";

const upgradeOptions=[
  {
    id:"spread",name:"🔱 발사 범위 +1",
    description:"발사되는 탄환의 방향이 한 갈래 추가됩니다. 중복 강화 가능!",
    apply(){upgrades.spread++;}
  },
  {
    id:"laser",name:"🔵 자동 레이저",
    description:"일정 시간마다 직선 레이저를 추가 발사합니다. 기본 탄환은 그대로 발사됩니다.",
    apply(){upgrades.laser++;}
  },
  {
    id:"pet",name:"🤖 공격 펫",
    description:"우주선 옆에서 일정 시간마다 탄환을 발사하는 펫을 얻습니다.",
    apply(){upgrades.pet++;createPets();}
  },
  {
    id:"damage",name:"💥 공격력 강화",
    description:"기본 탄환과 펫의 공격력이 1 증가합니다. 중복 강화 가능!",
    apply(){upgrades.damage++;}
  },
  {
    id:"shield",name:"🛡️ 보호막",
    description:"적의 공격을 한 번 막아주는 보호막을 얻습니다.",
    apply(){upgrades.shield++;player.shield++;}
  },
  {
    id:"rapid",name:"⚡ 연사 강화",
    description:"기본 탄환의 발사 간격이 짧아집니다.",
    apply(){upgrades.rapid++;}
  },
  {
    id:"pierce",name:"✨ 관통 탄환",
    description:"기본 탄환이 적을 관통해 추가로 공격합니다.",
    apply(){upgrades.pierce++;}
  },
  {
    id:"side",name:"🪽 양쪽 보조포",
    description:"우주선 양옆에서 추가 탄환을 발사합니다. 중복 강화 가능!",
    apply(){upgrades.side++;}
  },
  {
    id:"move",name:"💨 기동력 강화",
    description:"드래그 이동 속도가 증가합니다.",
    apply(){upgrades.move++;}
  },
  {
    id:"petPower",name:"🤖 펫 화력 강화",
    description:"공격 펫의 탄환 피해량이 증가합니다.",
    apply(){upgrades.petPower++;}
  },
  {
    id:"laserPower",name:"⚡ 레이저 강화",
    description:"자동 레이저의 피해량과 관통 횟수가 증가합니다.",
    apply(){upgrades.laser++; }
  },
  {
    id:"repair",name:"💠 보호막 충전",
    description:"보호막을 한 개 추가로 얻습니다.",
    apply(){player.shield++;upgrades.shield++;}
  }
];

// 초기화
function resetGame(){
  score=0;elapsed=0;nextUpgrade=25;nextBoss=60;
  bullets=[];enemies=[];particles=[];enemyBullets=[];bossBullets=[];missiles=[];pets=[];
  boss=null;enemySpawnTimer=0;petTimer=0;laserTimer=0;fireCooldown=0;

  upgrades={spread:1,damage:1,pet:0,shield:0,rapid:0,laser:0,pierce:0,side:0,move:0,petPower:0};

  player={x:W/2,y:H-85,radius:13,shield:0,lives:3,invulnerableUntil:0};


  pointerX=player.x;pointerY=player.y;

  stars=[];
  for(let i=0;i<75;i++){
    stars.push({x:Math.random()*W,y:Math.random()*H,size:Math.random()*2+.5,speed:Math.random()*65+25});
  }

  updateHUD();
  bossBarWrap.classList.remove("show");
}

// 랭킹
function getRanking(){
  try{
    const data=JSON.parse(localStorage.getItem(RANKING_KEY)||"[]");
    return Array.isArray(data)?data:[];
  }catch{return [];}
}

function renderRanking(){
  const ranking=getRanking();
  $("rankingList").innerHTML="";

  if(!ranking.length){
    $("rankingList").innerHTML='<div class="rank-row"><span>—</span><span>아직 기록이 없습니다.</span><span>—</span></div>';
    return;
  }

  ranking.slice(0,5).forEach((item,index)=>{
    const row=document.createElement("div");
    row.className="rank-row";

    const rank=document.createElement("span");
    rank.className="rank-number";
    rank.textContent=`${index+1}위`;

    const name=document.createElement("span");
    name.textContent=item.name;

    const points=document.createElement("span");
    points.className="rank-score";
    points.textContent=Number(item.score).toLocaleString();

    row.append(rank,name,points);
    $("rankingList").appendChild(row);
  });
}

function saveRanking(){
  const name=$("playerName").value.trim().slice(0,10)||"PLAYER";
  const ranking=getRanking();

  ranking.push({name,score,date:Date.now()});
  ranking.sort((a,b)=>b.score-a.score);

  try{
    localStorage.setItem(RANKING_KEY,JSON.stringify(ranking.slice(0,5)));
  }catch{
    message.textContent="기록을 저장하지 못했습니다.";
  }

  renderRanking();
  $("saveButton").disabled=true;
  $("saveButton").textContent="저장 완료";
}

// 게임 시작 / 종료
function startGame(){
  if(state==="playing")return;
  resetGame();

  state="playing";
  startOverlay.classList.remove("show");
  upgradeOverlay.classList.remove("show");
  gameOverOverlay.classList.remove("show");

  $("saveButton").disabled=false;
  $("saveButton").textContent="점수 저장";

  mainButton.textContent="게임 진행 중";
  message.textContent="적을 격파하고 살아남으세요!";

  lastTime=performance.now();
  if(animationId!==null)cancelAnimationFrame(animationId);
  animationId=requestAnimationFrame(loop);
}

function gameOver(){
  if(state==="gameover")return;
  state="gameover";
  firing=false;pointerDown=false;

  $("finalScore").textContent=`최종 점수: ${score.toLocaleString()}`;
  gameOverOverlay.classList.add("show");
  mainButton.textContent="다시 도전";
  message.textContent="GAME OVER!";

  if(animationId!==null){
    cancelAnimationFrame(animationId);
    animationId=null;
  }
  draw();
}

// HUD
function updateHUD(){
  scoreText.textContent=score.toLocaleString();
  livesText.textContent=player?player.lives:3;
  shieldText.textContent=player?player.shield:0;
}

// 플레이어 기본 공격
function shootPlayer(){
  const lanes=Math.max(1,Math.min(11,upgrades.spread));
  const spreadAngle=Math.min(.62,.13*(lanes-1));
  for(let i=0;i<lanes;i++){
    const ratio=lanes===1?0:(i/(lanes-1))*2-1;
    const angle=ratio*spreadAngle;
    bullets.push({
      x:player.x,y:player.y-15,
      vx:Math.sin(angle)*390,vy:-Math.cos(angle)*420,
      damage:upgrades.damage,radius:4,type:"normal",
      pierce:upgrades.pierce,hitIds:[]
    });
  }
  // 보조포는 기본 공격과 함께 발사
  for(let i=0;i<upgrades.side;i++){
    const offset=22+i*12;
    [-1,1].forEach(side=>{
      bullets.push({
        x:player.x+side*offset,y:player.y-5,
        vx:side*35,vy:-420,damage:upgrades.damage,
        radius:3,type:"side",pierce:upgrades.pierce,hitIds:[]
      });
    });
  }
}

function shootLaser(){
  bullets.push({
    x:player.x,y:player.y-18,vx:0,vy:-620,
    damage:upgrades.damage+upgrades.laser,
    radius:5,type:"laser",pierce:5+upgrades.laser*2,hitIds:[]
  });
}

function updatePlayer(dt){
  if(pointerDown){
    const moveRate=14+Math.min(10,upgrades.move*1.5);
    player.x+=(pointerX-player.x)*Math.min(1,dt*moveRate);
    player.y+=(pointerY-player.y)*Math.min(1,dt*moveRate);
  }

  player.x=Math.max(18,Math.min(W-18,player.x));
  player.y=Math.max(H*.42,Math.min(H-35,player.y));

  const interval=Math.max(.09,.28-upgrades.rapid*.035);
  fireCooldown-=dt;
  if(firing&&fireCooldown<=0){
    shootPlayer();
    fireCooldown=interval;
  }

  // 자동 레이저는 기본 탄환을 대체하지 않는 추가 공격
  if(upgrades.laser>0){
    laserTimer-=dt;
    if(laserTimer<=0){
      shootLaser();
      laserTimer=Math.max(.35,1.25-upgrades.laser*.08);
    }
  }
}

// 공격 펫
function createPets(){
  pets=[];
  for(let i=0;i<upgrades.pet;i++){
    pets.push({offset:i-(upgrades.pet-1)/2,x:player.x,y:player.y+5});
  }
}

function updatePets(dt){
  if(!pets.length)return;
  petTimer+=dt;

  pets.forEach(pet=>{
    const targetX=player.x+pet.offset*35;
    const targetY=player.y+5;
    pet.x+=(targetX-pet.x)*Math.min(1,dt*5);
    pet.y+=(targetY-pet.y)*Math.min(1,dt*5);
  });

  if(petTimer>=Math.max(.35,1.1-upgrades.pet*.12)){
    petTimer=0;
    pets.forEach(pet=>{
      bullets.push({
        x:pet.x,y:pet.y-10,vx:0,vy:-350,
        damage:upgrades.damage+upgrades.petPower,radius:3,type:"pet"
      });
    });
  }
}

// 적 생성: 시간이 지날수록 체력 증가
function spawnEnemy(){
  const difficulty=elapsed/90;
  const tough=Math.random()<.2;

  const baseHp=tough?3:1;
  const hp=Math.max(1,Math.ceil(baseHp*(1+difficulty)));

  enemies.push({
    id:Math.random(),
    x:Math.random()*(W-50)+25,
    y:-25,
    radius:tough?18:13,
    hp,maxHp:hp,
    speed:(tough?65:90)+Math.min(elapsed*.25,80),
    value:tough?30:10,
    color:tough?"#ffb13b":"#ff426f",
    vx:tough?0:(Math.random()-.5)*35
  });
}

function updateEnemies(dt){
  const spawnInterval=Math.max(.28,.95-elapsed*.006);
  enemySpawnTimer+=dt;

  if(enemySpawnTimer>=spawnInterval&&!boss){
    enemySpawnTimer=0;
    spawnEnemy();
  }

  enemies.forEach(enemy=>{
    enemy.y+=enemy.speed*dt;
    enemy.x+=enemy.vx*dt;

    if(enemy.x<enemy.radius||enemy.x>W-enemy.radius)enemy.vx*=-1;
  });

  enemies=enemies.filter(enemy=>enemy.y<H+40);
}

// 보스
function spawnBoss(){
  const bossHp=Math.floor(100*(1+elapsed/100));

  boss={
    x:W/2,y:90,width:125,height:65,
    hp:bossHp,maxHp:bossHp,
    attackTimer:1.5,
    laserX:0,laserWarning:false,laserActive:false,
    laserDuration:0,laserHit:false,
    missileCooldown:1.8,patternIndex:0
  };

  enemies=[];
  bossBarWrap.classList.add("show");
  message.textContent="⚠ BOSS 등장! 공격을 피하세요!";
}

function fireBossPattern(){
  if(!boss)return;
  const dx=player.x-boss.x,dy=player.y-boss.y;
  const baseAngle=Math.atan2(dy,dx);
  const add=(angle,speed=175,radius=7)=>{
    bossBullets.push({
      x:boss.x,y:boss.y+24,
      vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      radius,damage:1
    });
  };

  // 공격 패턴을 순환시켜 다양한 방향으로 탄환 발사
  const pattern=boss.patternIndex++%4;
  if(pattern===0){
    // 넓은 부채꼴
    for(let i=-3;i<=3;i++)add(Math.PI/2+i*.22,165,7);
  }else if(pattern===1){
    // 플레이어 방향을 겨냥한 3연발
    for(let i=-1;i<=1;i++)add(baseAngle+i*.16,205,7);
  }else if(pattern===2){
    // 원형 탄막
    for(let i=0;i<12;i++)add((Math.PI*2/12)*i,145,6);
  }else{
    // 좌우로 퍼지는 빠른 탄막
    for(let i=-4;i<=4;i++)add(Math.PI/2+i*.13,225,6);
  }
}

function updateBoss(dt){
  if(!boss)return;

  boss.attackTimer-=dt;
  boss.missileCooldown-=dt;

  if(!boss.laserWarning&&!boss.laserActive&&boss.attackTimer<=0){
    boss.laserWarning=true;
    boss.laserX=player.x;
    boss.laserDuration=.8;
    boss.attackTimer=4.8;
  }

  if(boss.laserWarning){
    boss.laserDuration-=dt;
    if(boss.laserDuration<=0){
      boss.laserWarning=false;
      boss.laserActive=true;
      boss.laserDuration=.55;
      boss.laserHit=false;
    }
  }

  if(boss.laserActive){
    boss.laserDuration-=dt;
    if(!boss.laserHit&&Math.abs(player.x-boss.laserX)<24&&player.y<H-20){
      boss.laserHit=true;
      damagePlayer();
    }
    if(boss.laserDuration<=0)boss.laserActive=false;
  }

  // 일반 탄막 패턴
  boss.patternTimer=(boss.patternTimer??1.1)-dt;
  if(boss.patternTimer<=0){
    fireBossPattern();
    boss.patternTimer=1.65;
  }

  // 유도 미사일 발사
  if(boss.missileCooldown<=0){
    const launchAngle=Math.atan2(player.y-(boss.y+25),player.x-boss.x);
    missiles.push({
      x:boss.x,y:boss.y+25,
      vx:Math.cos(launchAngle)*85,vy:Math.sin(launchAngle)*85,
      speed:125+Math.min(25,elapsed*.12),radius:8,life:6
    });
    boss.missileCooldown=3.6;
  }

  updateBossBar();
}

function updateBossBar(){
  if(!boss)return;
  bossBarFill.style.width=`${Math.max(0,boss.hp/boss.maxHp)*100}%`;
}

function defeatBoss(){
  score+=500;
  for(let i=0;i<45;i++){
    createExplosion(
      boss.x+(Math.random()-.5)*100,
      boss.y+(Math.random()-.5)*70,
      "#ff70cb"
    );
  }
  boss=null;
  // 보스가 쓰러지면 보스가 발사한 미사일과 탄막을 즉시 제거
  missiles=[];
  bossBullets=[];
  enemyBullets=[];
  bossBarWrap.classList.remove("show");
  nextBoss=elapsed+60;
  message.textContent="BOSS 격파! 보너스 점수 500점 획득!";
  updateHUD();
}

// 유도 미사일: 추적 강도를 낮춰 방향 전환이 늦고 빗나갈 수 있음
function updateMissiles(dt){
  missiles.forEach(m=>{
    const dx=player.x-m.x,dy=player.y-m.y;
    const length=Math.hypot(dx,dy)||1;
    const targetVX=dx/length*m.speed;
    const targetVY=dy/length*m.speed;
    m.vx+=(targetVX-m.vx)*dt*.38;
    m.vy+=(targetVY-m.vy)*dt*.38;
    m.x+=m.vx*dt;
    m.y+=m.vy*dt;
    m.life-=dt;
  });
  missiles=missiles.filter(m=>m.life>0&&m.y<H+35&&m.y>-35&&m.x>-40&&m.x<W+40);
}

function updateBossBullets(dt){
  bossBullets.forEach(b=>{
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
  });
  bossBullets=bossBullets.filter(b=>b.x>-35&&b.x<W+35&&b.y>-35&&b.y<H+35);
}

function updateEnemyBullets(dt){
  enemyBullets.forEach(b=>{
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
  });
  enemyBullets=enemyBullets.filter(b=>b.y<H+30&&b.y>-30);
}

// 충돌 및 피해
function damagePlayer(){
  if(state!=="playing"||!player)return;

  const now=performance.now();
  // 연속 충돌로 목숨이 한꺼번에 줄어들지 않도록 짧은 무적 시간을 적용
  if(now<player.invulnerableUntil)return;
  player.invulnerableUntil=now+850;

  if(player.shield>0){
    player.shield--;
    updateHUD();
    createExplosion(player.x,player.y,"#57eaff");
    message.textContent="보호막이 공격을 막았습니다!";
    return;
  }

  player.lives--;
  updateHUD();
  createExplosion(player.x,player.y,"#ff668c",20);

  if(player.lives<=0){
    gameOver();
  }else{
    message.textContent=`피격! 남은 목숨 ${player.lives}개`;
  }
}

function updateCollisions(){
  for(let i=bullets.length-1;i>=0;i--){
    const bullet=bullets[i];
    let removeBullet=false;

    for(let j=enemies.length-1;j>=0;j--){
      const enemy=enemies[j];

      if(bullet.hitIds&&bullet.hitIds.includes(enemy.id))continue;

      if(Math.hypot(bullet.x-enemy.x,bullet.y-enemy.y)<bullet.radius+enemy.radius){
        enemy.hp-=bullet.damage;

        createExplosion(bullet.x,bullet.y,bullet.type==="laser"?"#6ffaff":enemy.color,4);

        if(bullet.type==="laser"||bullet.pierce>0){
          bullet.hitIds.push(enemy.id);
          bullet.pierce--;
          if(bullet.pierce<0)removeBullet=true;
        }else{
          removeBullet=true;
        }

        if(enemy.hp<=0){
          score+=enemy.value;
          createExplosion(enemy.x,enemy.y,enemy.color);
          enemies.splice(j,1);
        }

        if(bullet.type!=="laser"&&!(bullet.pierce>0))break;
      }
    }

    if(!removeBullet&&boss){
      if(
        bullet.x>boss.x-boss.width/2&&
        bullet.x<boss.x+boss.width/2&&
        bullet.y>boss.y-boss.height/2&&
        bullet.y<boss.y+boss.height/2
      ){
        boss.hp-=bullet.damage;
        if(bullet.type==="laser"||bullet.pierce>0){
          bullet.pierce--;
          if(bullet.pierce<0)removeBullet=true;
        }else{
          removeBullet=true;
        }

        if(boss.hp<=0)defeatBoss();
        else updateBossBar();
      }
    }

    if(removeBullet)bullets.splice(i,1);
  }

  for(const enemy of enemies){
    if(Math.hypot(player.x-enemy.x,player.y-enemy.y)<player.radius+enemy.radius){
      damagePlayer();
      if(state!=="playing")return;
      enemy.y=H+100;
    }
  }

  for(const missile of missiles){
    if(Math.hypot(player.x-missile.x,player.y-missile.y)<player.radius+missile.radius){
      missile.y=H+100;
      damagePlayer();
      if(state!=="playing")return;
    }
  }

  for(const bullet of enemyBullets){
    if(Math.hypot(player.x-bullet.x,player.y-bullet.y)<player.radius+bullet.radius){
      bullet.y=H+100;
      damagePlayer();
      if(state!=="playing")return;
    }
  }

  for(const bullet of bossBullets){
    if(Math.hypot(player.x-bullet.x,player.y-bullet.y)<player.radius+bullet.radius){
      bullet.y=H+100;
      damagePlayer();
      if(state!=="playing")return;
    }
  }
}

// 강화 선택
function showUpgrade(){
  state="upgrade";
  firing=false;
  upgradeOverlay.classList.add("show");

  const choices=[...upgradeOptions].sort(()=>Math.random()-.5).slice(0,3);
  const list=$("upgradeList");
  list.innerHTML="";

  choices.forEach(option=>{
    const button=document.createElement("button");
    button.className="upgrade-card";

    const title=document.createElement("strong");
    title.textContent=option.name;

    const description=document.createElement("span");
    description.textContent=option.description;

    button.append(title,description);

    button.addEventListener("click",()=>{
      option.apply();
      upgradeOverlay.classList.remove("show");
      state="playing";
      message.textContent=`${option.name} 강화 완료!`;
      lastTime=performance.now();
      animationId=requestAnimationFrame(loop);
    });

    list.appendChild(button);
  });
}

// 파티클
function createExplosion(x,y,color,amount=12){
  for(let i=0;i<amount;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=Math.random()*130+30;

    particles.push({
      x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      life:.45+Math.random()*.35,maxLife:.8,
      size:Math.random()*3+1,color
    });
  }
}

function updateParticles(dt){
  particles.forEach(p=>{
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.life-=dt;
  });
  particles=particles.filter(p=>p.life>0);
}

function updateStars(dt){
  stars.forEach(s=>{
    s.y+=s.speed*dt;
    if(s.y>H){s.y=0;s.x=Math.random()*W;}
  });
}

// 그리기
function drawBackground(){
  ctx.fillStyle="#070b19";
  ctx.fillRect(0,0,W,H);

  const gradient=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,H);
  gradient.addColorStop(0,"rgba(25,35,90,.3)");
  gradient.addColorStop(1,"rgba(5,8,20,0)");
  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);

  stars.forEach(s=>{
    ctx.fillStyle="rgba(160,210,255,.8)";
    ctx.fillRect(s.x,s.y,s.size,s.size);
  });
}

function drawPlayer(){
  if(!player)return;

  if(player.shield>0){
    ctx.beginPath();
    ctx.arc(player.x,player.y,25,0,Math.PI*2);
    ctx.strokeStyle="#53eaff";
    ctx.lineWidth=2;
    ctx.shadowColor="#53eaff";
    ctx.shadowBlur=14;
    ctx.stroke();
    ctx.shadowBlur=0;
  }

  ctx.beginPath();
  ctx.moveTo(player.x-6,player.y+12);
  ctx.lineTo(player.x,player.y+29+Math.random()*7);
  ctx.lineTo(player.x+6,player.y+12);
  ctx.closePath();
  ctx.fillStyle="#36dfff";
  ctx.shadowColor="#36dfff";
  ctx.shadowBlur=15;
  ctx.fill();
  ctx.shadowBlur=0;

  ctx.beginPath();
  ctx.moveTo(player.x,player.y-18);
  ctx.lineTo(player.x-17,player.y+15);
  ctx.lineTo(player.x,player.y+9);
  ctx.lineTo(player.x+17,player.y+15);
  ctx.closePath();

  const shipColor="#54eaff";
  ctx.fillStyle=shipColor;
  ctx.shadowColor=shipColor;
  ctx.shadowBlur=16;
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle="#fff";
  ctx.lineWidth=1.5;
  ctx.stroke();
}

function drawPets(){
  pets.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,8,0,Math.PI*2);
    ctx.fillStyle="#ffdc65";
    ctx.shadowColor="#ffdc65";
    ctx.shadowBlur=12;
    ctx.fill();
    ctx.shadowBlur=0;
  });
}

function drawBullets(){
  bullets.forEach(b=>{
    if(b.type==="laser"){
      ctx.fillStyle="#70faff";
      ctx.shadowColor="#37eaff";
      ctx.shadowBlur=20;
      ctx.fillRect(b.x-5,b.y-17,10,32);
      ctx.fillStyle="#fff";
      ctx.fillRect(b.x-2,b.y-15,4,28);
    }else{
      ctx.fillStyle=b.type==="pet"?"#ffdf70":b.type==="side"?"#a5ff8c":"#75f6ff";
      ctx.shadowColor=b.type==="pet"?"#ffdf70":b.type==="side"?"#a5ff8c":"#42dfff";
      ctx.shadowBlur=12;
      ctx.fillRect(b.x-2,b.y-8,4,13);
    }
    ctx.shadowBlur=0;
  });
}

function drawEnemies(){
  enemies.forEach(e=>{
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);
    ctx.fillStyle=e.color;
    ctx.shadowColor=e.color;
    ctx.shadowBlur=12;
    ctx.fill();
    ctx.shadowBlur=0;

    // 체력 표시
    if(e.maxHp>1||elapsed>15){
      ctx.fillStyle="#301622";
      ctx.fillRect(e.x-16,e.y-e.radius-9,32,4);
      ctx.fillStyle="#ffce6a";
      ctx.fillRect(e.x-16,e.y-e.radius-9,32*Math.max(0,e.hp/e.maxHp),4);
    }
  });
}

function drawBoss(){
  if(!boss)return;

  if(boss.laserWarning){
    ctx.strokeStyle="rgba(255,70,120,.6)";
    ctx.lineWidth=3;
    ctx.setLineDash([8,7]);
    ctx.beginPath();
    ctx.moveTo(boss.laserX,boss.y+25);
    ctx.lineTo(boss.laserX,H);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if(boss.laserActive){
    ctx.fillStyle="rgba(255,40,100,.35)";
    ctx.fillRect(boss.laserX-20,boss.y+25,40,H);
    ctx.fillStyle="#ff477e";
    ctx.shadowColor="#ff477e";
    ctx.shadowBlur=20;
    ctx.fillRect(boss.laserX-5,boss.y+25,10,H);
    ctx.shadowBlur=0;
  }

  ctx.save();
  ctx.translate(boss.x,boss.y);

  ctx.beginPath();
  ctx.moveTo(-62,-15);
  ctx.lineTo(-42,-32);
  ctx.lineTo(0,-25);
  ctx.lineTo(42,-32);
  ctx.lineTo(62,-15);
  ctx.lineTo(48,27);
  ctx.lineTo(0,35);
  ctx.lineTo(-48,27);
  ctx.closePath();

  ctx.fillStyle="#a12b83";
  ctx.shadowColor="#ff3ba7";
  ctx.shadowBlur=22;
  ctx.fill();
  ctx.strokeStyle="#ff9cde";
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.shadowBlur=0;

  ctx.fillStyle="#fff";
  ctx.fillRect(-28,-4,15,7);
  ctx.fillRect(13,-4,15,7);
  ctx.restore();
}

function drawMissiles(){
  missiles.forEach(m=>{
    ctx.save();
    ctx.translate(m.x,m.y);
    ctx.rotate(Math.atan2(m.vy,m.vx)+Math.PI/2);
    ctx.beginPath();
    ctx.moveTo(0,-10);
    ctx.lineTo(-6,8);
    ctx.lineTo(0,5);
    ctx.lineTo(6,8);
    ctx.closePath();
    ctx.fillStyle="#ff9b49";
    ctx.shadowColor="#ff5c36";
    ctx.shadowBlur=12;
    ctx.fill();
    ctx.restore();
  });
}

function drawEnemyBullets(){
  enemyBullets.forEach(b=>{
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
    ctx.fillStyle="#ff568b";
    ctx.shadowColor="#ff568b";
    ctx.shadowBlur=12;
    ctx.fill();
    ctx.shadowBlur=0;
  });
}

function drawBossBullets(){
  bossBullets.forEach(b=>{
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
    ctx.fillStyle="#ff6fbd";
    ctx.shadowColor="#ff3c9d";
    ctx.shadowBlur=15;
    ctx.fill();
    ctx.shadowBlur=0;
  });
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;
}

function draw(){
  drawBackground();
  drawBoss();
  drawEnemies();
  drawMissiles();
  drawEnemyBullets();
  drawBossBullets();
  drawBullets();
  drawPets();
  drawParticles();
  drawPlayer();
}

// 메인 루프
function loop(now){
  if(state!=="playing"){animationId=null;return;}

  const dt=Math.min((now-lastTime)/1000,.035);
  lastTime=now;
  // 보스가 살아 있는 동안에는 진행 시간과 강화 타이머를 정지
  if(!boss)elapsed+=dt;

  updateStars(dt);
  updatePlayer(dt);
  updatePets(dt);

  bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;});
  bullets=bullets.filter(b=>b.y>-25&&b.x>-25&&b.x<W+25);

  updateEnemies(dt);
  updateBoss(dt);
  updateMissiles(dt);
  updateEnemyBullets(dt);
  updateBossBullets(dt);
  updateParticles(dt);
  updateCollisions();

  if(state!=="playing")return;

  if(!boss&&elapsed>=nextBoss)spawnBoss();

  if(elapsed>=nextUpgrade){
    nextUpgrade+=25;
    draw();
    updateHUD();
    showUpgrade();
    return;
  }

  updateHUD();
  draw();

  if(state==="playing")animationId=requestAnimationFrame(loop);
}

// 입력
function setPointer(event){
  const rect=canvas.getBoundingClientRect();
  pointerX=(event.clientX-rect.left)*W/rect.width;
  pointerY=(event.clientY-rect.top)*H/rect.height;
  pointerX=Math.max(18,Math.min(W-18,pointerX));
  pointerY=Math.max(H*.42,Math.min(H-35,pointerY));
}

canvas.addEventListener("pointerdown",event=>{
  if(state!=="playing")return;
  canvas.setPointerCapture(event.pointerId);
  setPointer(event);
  pointerDown=true;
  firing=true;
});

canvas.addEventListener("pointermove",event=>{
  if(!pointerDown||state!=="playing")return;
  setPointer(event);
});

function stopPointer(){pointerDown=false;firing=false;}
canvas.addEventListener("pointerup",stopPointer);
canvas.addEventListener("pointercancel",stopPointer);
canvas.addEventListener("lostpointercapture",stopPointer);

document.addEventListener("keydown",event=>{
  if(event.code==="Space"&&state==="playing"){
    event.preventDefault();
    firing=true;
  }
});

document.addEventListener("keyup",event=>{
  if(event.code==="Space")firing=false;
});

// 버튼
$("playButton").addEventListener("click",startGame);
$("retryButton").addEventListener("click",()=>{
  state="menu";
  gameOverOverlay.classList.remove("show");
  startOverlay.classList.add("show");
  mainButton.textContent="게임 시작";
  message.textContent="다시 도전할 준비가 되었습니다!";
});

mainButton.addEventListener("click",()=>{
  if(state==="menu"){
    startOverlay.classList.add("show");
  }else if(state==="gameover"){
    state="menu";
    gameOverOverlay.classList.remove("show");
    startOverlay.classList.add("show");
  }
});

$("saveButton").addEventListener("click",saveRanking);

// 최초 실행
resetGame();
renderRanking();
draw();

})();
</script>

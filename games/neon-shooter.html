
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08091a">
<title>NEON STRIKE | 카지노</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 22px 12px;
  background:
    radial-gradient(ellipse at 50% 0%, #20204c 0%, transparent 48%),
    #08091a;
  color: #edf3ff;
  font-family: Arial, "Noto Sans KR", sans-serif;
  text-align: center;
}

.game {
  width: 100%;
  max-width: 490px;
  margin: auto;
}

.top-label {
  color: #8b7cff;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 5px;
}

h1 {
  margin: 10px 0 4px;
  font-size: 38px;
  letter-spacing: 4px;
  color: #fff;
  text-shadow:
    0 0 8px #7565ff,
    0 0 25px #5745ff;
}

.description {
  color: #929bbd;
  font-size: 13px;
  margin: 8px 0 20px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.stat {
  padding: 11px 5px;
  border: 1px solid #34345e;
  border-radius: 12px;
  background: linear-gradient(145deg, #171a38, #101329);
  box-shadow: inset 0 0 15px rgba(94, 79, 255, .08);
}

.stat small {
  display: block;
  color: #929bbd;
  font-size: 10px;
  letter-spacing: 1px;
  margin-bottom: 5px;
}

.stat strong {
  color: #8eeaff;
  font-size: 21px;
  text-shadow: 0 0 10px rgba(61, 219, 255, .4);
}

.board-wrap {
  position: relative;
  overflow: hidden;
  border: 1px solid #6258c9;
  border-radius: 17px;
  background: #080a19;
  box-shadow:
    0 0 12px rgba(110, 88, 255, .35),
    0 0 35px rgba(66, 81, 255, .12);
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 25px;
  background: rgba(5, 7, 24, .82);
  backdrop-filter: blur(5px);
}

.overlay[hidden] {
  display: none;
}

.overlay h2 {
  color: #8eeaff;
  font-size: 34px;
  letter-spacing: 3px;
  text-shadow: 0 0 18px #397dff;
  margin: 0 0 12px;
}

.overlay p {
  color: #c1c7e6;
  font-size: 13px;
  line-height: 1.8;
}

.message {
  min-height: 23px;
  margin: 14px 0;
  color: #9c91ff;
  font-size: 13px;
  font-weight: bold;
}

button {
  border: 1px solid #7167ed;
  border-radius: 12px;
  padding: 14px 20px;
  background: linear-gradient(135deg, #6254db, #343a91);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 16px rgba(91, 82, 255, .22);
}

button:active {
  transform: scale(.97);
}

button:disabled {
  opacity: .55;
  cursor: default;
}

.start {
  width: 100%;
}

.back {
  display: inline-block;
  margin-top: 22px;
  color: #9b91ff;
  font-size: 13px;
  text-decoration: none;
}

@media (max-width: 380px) {
  body {
    padding: 15px 8px;
  }

  h1 {
    font-size: 32px;
  }

  .stat {
    padding: 9px 3px;
  }

  .stat strong {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<main class="game">

  <div class="top-label">CASINO ARCADE SERIES</div>

  <h1>NEON STRIKE</h1>

  <p class="description">
    적을 격추하고 우주 전장을 지배하세요.
  </p>

  <div class="stats">
    <div class="stat">
      <small>SCORE</small>
      <strong id="score">0</strong>
    </div>

    <div class="stat">
      <small>BEST</small>
      <strong id="best">0</strong>
    </div>

    <div class="stat">
      <small>HULL</small>
      <strong id="health">3</strong>
    </div>
  </div>

  <div class="board-wrap">

    <canvas id="board" width="420" height="620"></canvas>

    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">NEON STRIKE</h2>
      <p id="overlayText">
        드래그로 전투기를 움직이고<br>
        클릭 또는 터치로 레이저를 발사하세요.
      </p>
    </div>

  </div>

  <div class="message" id="message">
    전투 준비 완료
  </div>

  <button class="start" id="start">
    전투 시작
  </button>

  <a class="back" href="../index.html">
    ← 카지노 메인으로
  </a>

</main>

<script>
(() => {
"use strict";

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");
const healthText = document.getElementById("health");
const message = document.getElementById("message");
const startButton = document.getElementById("start");
const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");

const W = canvas.width;
const H = canvas.height;

let player;
let enemies = [];
let bullets = [];
let particles = [];
let stars = [];

let score = 0;
let best = 0;
let health = 3;

let running = false;
let animationId = null;
let lastTime = 0;
let elapsed = 0;
let spawnTimer = 0;
let fireCooldown = 0;
let damageCooldown = 0;

let pointerDown = false;
let pointerMoved = false;
let pointerStart = null;

const PLAYER_SPEED = 420;
const FIRE_INTERVAL = 190;
const INITIAL_SPAWN = 1050;
const MIN_SPAWN = 270;

try {
  best = Number(localStorage.getItem("neonBest")) || 0;
} catch (e) {
  best = 0;
}

bestText.textContent = best;

// 별 배경
function createStars() {
  stars = Array.from({ length: 100 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    size: .5 + Math.random() * 1.8,
    speed: 20 + Math.random() * 90,
    alpha: .2 + Math.random() * .7
  }));
}

function createPlayer() {
  player = {
    x: W / 2,
    y: H - 75,
    width: 34,
    height: 43,
    targetX: W / 2,
    targetY: H - 75
  };
}

function updateHUD() {
  scoreText.textContent = score;
  bestText.textContent = best;
  healthText.textContent = health;
}

function saveBest() {
  if (score <= best) return;

  best = score;

  try {
    localStorage.setItem("neonBest", String(best));
  } catch (e) {}

  updateHUD();
}

// 별 배경 그리기
function drawBackground(dt) {
  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, "#090a22");
  gradient.addColorStop(.55, "#10102b");
  gradient.addColorStop(1, "#08091a");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // 성운 효과
  const glow = ctx.createRadialGradient(
    W * .5, H * .45, 10,
    W * .5, H * .45, 300
  );

  glow.addColorStop(0, "rgba(72, 45, 170, .12)");
  glow.addColorStop(1, "rgba(10, 10, 30, 0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // 별 이동
  stars.forEach(star => {
    star.y += star.speed * dt;

    if (star.y > H) {
      star.y = 0;
      star.x = Math.random() * W;
    }

    ctx.globalAlpha = star.alpha;
    ctx.fillStyle = "#b8dfff";

    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.globalAlpha = 1;

  // 배경 회로선
  ctx.strokeStyle = "rgba(95, 105, 255, .055)";
  ctx.lineWidth = 1;

  for (let y = 40; y < H; y += 80) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

// 플레이어 그리기
function drawPlayer() {
  if (damageCooldown > 0 && Math.floor(elapsed * 15) % 2 === 0) {
    return;
  }

  ctx.save();
  ctx.translate(player.x, player.y);

  // 엔진 불꽃
  const flame = ctx.createLinearGradient(0, 12, 0, 43);
  flame.addColorStop(0, "#8ffaff");
  flame.addColorStop(.5, "#398dff");
  flame.addColorStop(1, "rgba(116, 55, 255, 0)");

  ctx.fillStyle = flame;

  ctx.beginPath();
  ctx.moveTo(-7, 12);
  ctx.lineTo(0, 42 + Math.random() * 8);
  ctx.lineTo(7, 12);
  ctx.closePath();
  ctx.fill();

  // 날개
  ctx.shadowBlur = 18;
  ctx.shadowColor = "#7a5cff";

  const wing = ctx.createLinearGradient(-20, 0, 20, 0);
  wing.addColorStop(0, "#4435a8");
  wing.addColorStop(.5, "#6ceeff");
  wing.addColorStop(1, "#4435a8");

  ctx.fillStyle = wing;

  ctx.beginPath();
  ctx.moveTo(0, -21);
  ctx.lineTo(19, 15);
  ctx.lineTo(11, 12);
  ctx.lineTo(0, 18);
  ctx.lineTo(-11, 12);
  ctx.lineTo(-19, 15);
  ctx.closePath();
  ctx.fill();

  // 기체 중심
  ctx.fillStyle = "#d7faff";

  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.lineTo(8, 12);
  ctx.lineTo(0, 18);
  ctx.lineTo(-8, 12);
  ctx.closePath();
  ctx.fill();

  // 조종석
  ctx.fillStyle = "#247dce";

  ctx.beginPath();
  ctx.ellipse(0, -4, 4, 9, 0, 0, Math.PI * 2);
  ctx.fill();

  // 기체 빛
  ctx.strokeStyle = "#a5f6ff";
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(0, -20);
  ctx.lineTo(0, 14);
  ctx.stroke();

  ctx.restore();
}

// 적 그리기
function drawEnemy(enemy) {
  ctx.save();
  ctx.translate(enemy.x, enemy.y);

  ctx.shadowBlur = 16;
  ctx.shadowColor = enemy.color;

  if (enemy.type === "drone") {
    ctx.fillStyle = "#ff477d";

    ctx.beginPath();
    ctx.moveTo(0, -enemy.size / 2);
    ctx.lineTo(enemy.size / 2, 0);
    ctx.lineTo(0, enemy.size / 2);
    ctx.lineTo(-enemy.size / 2, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ffd4e4";
    ctx.fillRect(-3, -3, 6, 6);
  } else {
    ctx.fillStyle = "#a16bff";

    ctx.beginPath();

    for (let i = 0; i < 8; i++) {
      const angle = i * Math.PI / 4;
      const radius = enemy.size * (
        i % 2 === 0 ? .56 : .4
      );

      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }

    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#d7c4ff";
    ctx.beginPath();
    ctx.arc(-4, -3, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// 레이저 그리기
function drawBullets() {
  bullets.forEach(bullet => {
    ctx.save();

    ctx.shadowBlur = 15;
    ctx.shadowColor = "#52efff";

    ctx.fillStyle = "#d8ffff";
    ctx.fillRect(
      bullet.x - 2,
      bullet.y - 12,
      4,
      19
    );

    ctx.fillStyle = "#37dfff";
    ctx.fillRect(
      bullet.x - 5,
      bullet.y - 5,
      10,
      8
    );

    ctx.restore();
  });
}

// 폭발 파티클
function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life);

    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.globalAlpha = 1;
}

// 전체 그리기
function draw(dt) {
  drawBackground(dt);

  enemies.forEach(drawEnemy);
  drawBullets();
  drawParticles();
  drawPlayer();
}

// 적 생성
function spawnEnemy() {
  const difficulty = Math.min(elapsed / 45, 2.5);

  const isRock = Math.random() < .38;

  const size = isRock
    ? 23 + Math.random() * 16
    : 22 + Math.random() * 10;

  enemies.push({
    x: size + Math.random() * (W - size * 2),
    y: -size,
    size,
    type: isRock ? "rock" : "drone",
    color: isRock ? "#a16bff" : "#ff477d",
    speed: (105 + Math.random() * 65) * (1 + difficulty),
    hp: isRock ? 2 : 1,
    rotation: Math.random() * Math.PI * 2,
    rotationSpeed: (Math.random() - .5) * 2
  });
}

// 총알 발사
function shoot() {
  if (!running) return;
  if (fireCooldown > 0) return;

  bullets.push({
    x: player.x,
    y: player.y - 20,
    speed: 570
  });

  fireCooldown = FIRE_INTERVAL;
}

// 폭발 생성
function createExplosion(x, y, color, amount = 16) {
  for (let i = 0; i < amount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 40 + Math.random() * 190;

    particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 1.5 + Math.random() * 3,
      life: 1,
      color
    });
  }
}

// 충돌 판정
function collides(a, b) {
  return (
    a.x - a.width / 2 < b.x + b.size / 2 &&
    a.x + a.width / 2 > b.x - b.size / 2 &&
    a.y - a.height / 2 < b.y + b.size / 2 &&
    a.y + a.height / 2 > b.y - b.size / 2
  );
}

// 업데이트
function update(delta) {
  const dt = Math.min(delta / 1000, .04);

  elapsed += dt;

  fireCooldown = Math.max(0, fireCooldown - delta);
  damageCooldown = Math.max(0, damageCooldown - delta);

  // 별과 배경
  stars.forEach(star => {
    star.y += star.speed * dt * (1 + elapsed / 100);
    if (star.y > H) {
      star.y = 0;
      star.x = Math.random() * W;
    }
  });

  // 플레이어 목표 위치로 이동
  player.x += (player.targetX - player.x) * Math.min(1, dt * 18);
  player.y += (player.targetY - player.y) * Math.min(1, dt * 18);

  player.x = Math.max(22, Math.min(W - 22, player.x));
  player.y = Math.max(35, Math.min(H - 35, player.y));

  // 적 생성 속도 증가
  spawnTimer += delta;

  const spawnInterval = Math.max(
    MIN_SPAWN,
    INITIAL_SPAWN - elapsed * 13
  );

  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnEnemy();

    if (elapsed > 35 && Math.random() < .25) {
      spawnEnemy();
    }
  }

  // 총알 이동
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y -= bullets[i].speed * dt;

    if (bullets[i].y < -20) {
      bullets.splice(i, 1);
    }
  }

  // 적 이동 및 충돌
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];

    enemy.y += enemy.speed * dt;
    enemy.rotation += enemy.rotationSpeed * dt;

    // 플레이어 충돌
    if (
      damageCooldown <= 0 &&
      collides(player, enemy)
    ) {
      enemies.splice(i, 1);
      createExplosion(enemy.x, enemy.y, enemy.color, 22);

      health--;
      damageCooldown = 1000;
      updateHUD();

      if (health <= 0) {
        endGame();
        return;
      }

      message.textContent = "피격! 전투기를 조심하세요!";
      continue;
    }

    // 레이저와 적 충돌
    let destroyed = false;

    for (let j = bullets.length - 1; j >= 0; j--) {
      const bullet = bullets[j];

      if (
        Math.abs(bullet.x - enemy.x) < enemy.size / 2 + 5 &&
        Math.abs(bullet.y - enemy.y) < enemy.size / 2 + 8
      ) {
        bullets.splice(j, 1);
        enemy.hp--;

        createExplosion(
          bullet.x,
          bullet.y,
          "#6ceeff",
          5
        );

        if (enemy.hp <= 0) {
          createExplosion(
            enemy.x,
            enemy.y,
            enemy.color,
            20
          );

          enemies.splice(i, 1);
          score += enemy.type === "rock" ? 20 : 10;
          updateHUD();
          saveBest();

          destroyed = true;
        }

        break;
      }
    }

    if (destroyed) continue;

    // 화면 아래로 지나간 적 제거
    if (enemy.y > H + enemy.size) {
      enemies.splice(i, 1);
    }
  }

  // 파티클 이동
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= .97;
    p.vy *= .97;
    p.life -= dt * 1.6;

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

// 게임 루프
function loop(timestamp) {
  if (!running) return;

  if (!lastTime) lastTime = timestamp;

  const delta = timestamp - lastTime;
  lastTime = timestamp;

  update(delta);
  draw(delta / 1000);

  if (running) {
    animationId = requestAnimationFrame(loop);
  }
}

// 게임 시작
function startGame() {
  if (running) return;

  resetGame();

  running = true;
  lastTime = 0;

  overlay.hidden = true;
  message.textContent = "전투 시작! 적을 격추하세요!";
  startButton.textContent = "전투 진행 중";
  startButton.disabled = true;

  animationId = requestAnimationFrame(loop);
}

// 게임 종료
function endGame() {
  running = false;

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  saveBest();

  overlay.hidden = false;
  overlayTitle.textContent = "MISSION FAILED";
  overlayText.innerHTML =
    `최종 점수: <strong>${score}</strong><br>전투 기록이 저장되었습니다.`;

  message.textContent = "전투 종료";
  startButton.textContent = "다시 도전";
  startButton.disabled = false;
}

// 초기화
function resetGame() {
  running = false;

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  createPlayer();

  enemies = [];
  bullets = [];
  particles = [];

  score = 0;
  health = 3;
  elapsed = 0;
  spawnTimer = 0;
  fireCooldown = 0;
  damageCooldown = 0;
  lastTime = 0;

  pointerDown = false;
  pointerMoved = false;
  pointerStart = null;

  createStars();
  updateHUD();

  draw(0);
}

// 화면 좌표를 게임 좌표로 변환
function getCanvasPosition(event) {
  const rect = canvas.getBoundingClientRect();

  return {
    x: (event.clientX - rect.left) * (W / rect.width),
    y: (event.clientY - rect.top) * (H / rect.height)
  };
}

// 드래그 시작
canvas.addEventListener("pointerdown", event => {
  if (!running) return;

  event.preventDefault();

  pointerDown = true;
  pointerMoved = false;

  pointerStart = getCanvasPosition(event);

  canvas.setPointerCapture(event.pointerId);
});

// 드래그 이동
canvas.addEventListener("pointermove", event => {
  if (!running || !pointerDown) return;

  event.preventDefault();

  const position = getCanvasPosition(event);

  if (
    Math.abs(position.x - pointerStart.x) > 4 ||
    Math.abs(position.y - pointerStart.y) > 4
  ) {
    pointerMoved = true;
  }

  player.targetX = position.x;
  player.targetY = position.y;
});

// 클릭 또는 탭 공격
canvas.addEventListener("pointerup", event => {
  if (!pointerDown) return;

  const position = getCanvasPosition(event);

  if (!pointerMoved) {
    shoot();
  } else {
    player.targetX = position.x;
    player.targetY = position.y;
  }

  pointerDown = false;
  pointerStart = null;
});

canvas.addEventListener("pointercancel", () => {
  pointerDown = false;
  pointerStart = null;
});

// 키보드 보조 공격
document.addEventListener("keydown", event => {
  if (event.code === "Space" && running) {
    event.preventDefault();
    shoot();
  }
});

startButton.addEventListener("click", startGame);

// 최초 실행
createStars();
createPlayer();
resetGame();

})();
</script>

</body>
</html>

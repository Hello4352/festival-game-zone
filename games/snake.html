
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Snake | 카지노</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1220;
      color: #f5f0df;
      font-family: Arial, sans-serif;
    }

    .game {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      color: #e9c76b;
      margin-bottom: 8px;
    }

    .description {
      color: #b8c0ce;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      flex: 1;
      padding: 12px;
      border: 1px solid #536078;
      border-radius: 10px;
      background: #142036;
    }

    .stat small {
      display: block;
      color: #aeb8c9;
      margin-bottom: 6px;
    }

    .stat strong {
      color: #e9c76b;
      font-size: 21px;
    }

    .board-wrap {
      position: relative;
      width: 100%;
      border: 3px solid #d6ad4c;
      border-radius: 12px;
      overflow: hidden;
      background: #101d30;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
    }

    .message {
      min-height: 28px;
      margin: 13px 0;
      color: #e9c76b;
      font-weight: bold;
    }

    .main-buttons {
      display: flex;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px;
      background: #e9c76b;
      color: #172033;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-buttons button {
      flex: 1;
    }

    .controls {
      width: 190px;
      margin: 20px auto 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .controls button {
      min-height: 48px;
      font-size: 21px;
      background: #263750;
      color: #f5f0df;
      border: 1px solid #536078;
      touch-action: manipulation;
      user-select: none;
    }

    .controls .empty {
      visibility: hidden;
    }

    .back {
      display: inline-block;
      margin-top: 22px;
      color: #e9c76b;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>snake</h1>
    <p class="description">
      먹이를 먹으며 뱀의 길이를 늘려 보세요!<br>
      벽이나 자신의 몸에 부딪히면 게임이 끝납니다.
    </p>

    <div class="stats">
      <div class="stat">
        <small>점수</small>
        <strong id="score">0</strong>
      </div>
      <div class="stat">
        <small>최고 기록</small>
        <strong id="best">0</strong>
      </div>
    </div>

    <div class="board-wrap">
      <canvas id="board" width="400" height="400"></canvas>
    </div>

    <div class="message" id="message">
      시작 버튼을 눌러 주세요!
    </div>

    <div class="main-buttons">
      <button id="start">게임 시작</button>
      <button id="pause">일시정지</button>
    </div>

    <div class="controls">
      <button class="empty"> </button>
      <button data-dir="up">▲</button>
      <button class="empty"> </button>
      <button data-dir="left">◀</button>
      <button data-dir="down">▼</button>
      <button data-dir="right">▶</button>
    </div>

    <a class="back" href="../index.html">← 카지노 메인으로</a>
  </main>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const bestText = document.getElementById("best");
    const message = document.getElementById("message");
    const startButton = document.getElementById("start");
    const pauseButton = document.getElementById("pause");

    const CELL = 20;
    const COUNT = 20;

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score = 0;
    let timer = null;
    let running = false;
    let paused = false;
    let best = 0;

    try {
      best = Number(localStorage.getItem("snakeBest")) || 0;
    } catch (error) {
      best = 0;
    }

    bestText.textContent = best;

    function resetGame() {
      clearInterval(timer);
      timer = null;

      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];

      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      running = false;
      paused = false;

      scoreText.textContent = score;
      message.textContent = "시작 버튼을 눌러 주세요!";
      startButton.textContent = "게임 시작";
      pauseButton.textContent = "일시정지";

      createFood();
      draw();
    }

    function createFood() {
      let position;

      do {
        position = {
          x: Math.floor(Math.random() * COUNT),
          y: Math.floor(Math.random() * COUNT)
        };
      } while (
        snake.some(part =>
          part.x === position.x && part.y === position.y
        )
      );

      food = position;
    }

    function draw() {
      ctx.fillStyle = "#101d30";
      ctx.fillRect(0, 0, 400, 400);

      // 격자
      ctx.strokeStyle = "#1c2b40";
      ctx.lineWidth = 1;

      for (let i = 0; i <= COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, 400);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(400, i * CELL);
        ctx.stroke();
      }

      // 먹이
      ctx.fillStyle = "#ef6262";
      ctx.beginPath();
      ctx.arc(
        food.x * CELL + CELL / 2,
        food.y * CELL + CELL / 2,
        8,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // 뱀
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#e9c76b" : "#38b879";
        ctx.beginPath();
        ctx.roundRect(
          part.x * CELL + 2,
          part.y * CELL + 2,
          CELL - 4,
          CELL - 4,
          5
        );
        ctx.fill();
      });
    }

    function setDirection(name) {
      const directions = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      const selected = directions[name];
      if (!selected) return;

      if (
        selected.x === -direction.x &&
        selected.y === -direction.y
      ) return;

      nextDirection = selected;
    }

    function move() {
      direction = nextDirection;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      const willEat =
        head.x === food.x && head.y === food.y;

      const bodyToCheck = willEat
        ? snake
        : snake.slice(0, -1);

      const hitWall =
        head.x < 0 || head.x >= COUNT ||
        head.y < 0 || head.y >= COUNT;

      const hitBody = bodyToCheck.some(part =>
        part.x === head.x && part.y === head.y
      );

      if (hitWall || hitBody) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (willEat) {
        score += 10;
        scoreText.textContent = score;

        if (score > best) {
          best = score;
          bestText.textContent = best;

          try {
            localStorage.setItem("snakeBest", String(best));
          } catch (error) {
            // 저장이 제한된 환경에서는 현재 기록만 표시합니다.
          }
        }

        createFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function startGame() {
      if (running && !paused) return;

      if (paused) {
        paused = false;
        running = true;
        message.textContent = "게임 진행 중!";
        pauseButton.textContent = "일시정지";
        return;
      }

      resetGame();
      running = true;
      message.textContent = "먹이를 먹으세요!";
      startButton.textContent = "새 게임";
      timer = setInterval(move, 130);
    }

    function togglePause() {
      if (!running) return;

      if (paused) {
        paused = false;
        timer = setInterval(move, 130);
        message.textContent = "게임 진행 중!";
        pauseButton.textContent = "일시정지";
      } else {
        paused = true;
        clearInterval(timer);
        timer = null;
        message.textContent = "일시정지 중";
        pauseButton.textContent = "계속하기";
      }
    }

    function endGame() {
      clearInterval(timer);
      timer = null;
      running = false;
      paused = false;

      message.textContent = "게임 종료! 최종 점수: " + score;
      startButton.textContent = "다시 시작";
      pauseButton.textContent = "일시정지";
    }

    document.addEventListener("keydown", event => {
      const keys = {
        ArrowUp: "up",
        ArrowDown: "down",
        ArrowLeft: "left",
        ArrowRight: "right",
        w: "up",
        s: "down",
        a: "left",
        d: "right"
      };

      if (keys[event.key]) {
        event.preventDefault();
        setDirection(keys[event.key]);
      }
    });

    document.querySelectorAll("[data-dir]").forEach(button => {
      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        setDirection(button.dataset.dir);
      });
    });

    startButton.addEventListener("click", startGame);
    pauseButton.addEventListener("click", togglePause);

    resetGame();
  </script>
</body>
</html>

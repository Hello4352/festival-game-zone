
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>벽돌 깨기 | 카지노</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 14px;
  background: radial-gradient(ellipse at top, #1b2b43, #0b1220 65%);
  color: #fff0c5;
  font-family: Arial, "Noto Sans KR", sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  padding: 25px;
  border: 1px solid #9b7840;
  border-radius: 25px;
  background: rgba(9, 17, 31, 0.8);
}

.eyebrow {
  color: #e7c477;
  letter-spacing: 4px;
  font-size: 13px;
  font-weight: bold;
}

h1 {
  margin: 15px 0 8px;
  font-size: 36px;
}

.description {
  color: #aebbd0;
  line-height: 1.6;
}

.scoreboard {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 24px 0 15px;
}

.score-box {
  flex: 1;
  max-width: 220px;
  padding: 12px 5px;
  border: 1px solid #9b7840;
  border-radius: 12px;
  background: #192941;
}

.score-box small {
  display: block;
  color: #aebbd0;
  margin-bottom: 6px;
}

.score-box strong {
  font-size: 22px;
  color: #e7c477;
}

.game-wrap {
  position: relative;
  width: 100%;
  overflow: hidden;
  border: 1px solid #9b7840;
  border-radius: 15px;
  background: #08111f;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  touch-action: none;
}

.message {
  margin: 16px 0;
  min-height: 25px;
  color: #e7c477;
  font-weight: bold;
  line-height: 1.5;
}

button {
  border: 1px solid #e7c477;
  border-radius: 30px;
  padding: 13px 25px;
  margin: 5px;
  background: #192941;
  color: #fff0c5;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #8b642b;
}

.back {
  display: inline-block;
  margin-top: 18px;
  color: #aebbd0;
  text-decoration: none;
}

@media (max-width: 380px) {
  .container {
    padding: 18px 12px;
  }

  .score-box {
    padding: 10px 3px;
  }

  .score-box strong {
    font-size: 19px;
  }
}
</style>
</head>

<body>
<div class="container">

  <div class="eyebrow">CASINO MINI GAME 02</div>

  <h1>벽돌 깨기</h1>

  <p class="description">
    공을 튕겨 모든 벽돌을 제거하세요!
  </p>

  <div class="scoreboard">
    <div class="score-box">
      <small>SCORE</small>
      <strong id="score">0</strong>
    </div>

    <div class="score-box">
      <small>STAGE</small>
      <strong id="stage">1</strong>
    </div>
  </div>

  <div class="game-wrap">
    <canvas id="game" width="600" height="450"></canvas>
  </div>

  <div class="message" id="message">
    시작 버튼을 눌러 도전하세요!
  </div>

  <button id="startButton">게임 시작</button>
  <button id="resetButton">다시 시작</button>

  <a class="back" href="../index.html">
    ← 카지노 메인으로 돌아가기
  </a>

</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const scoreText = document.getElementById("score");
  const stageText = document.getElementById("stage");
  const message = document.getElementById("message");
  const startButton = document.getElementById("startButton");
  const resetButton = document.getElementById("resetButton");

  const W = canvas.width;
  const H = canvas.height;

  // ==========================================
  // 스테이지별 공 속도 설정
  // ==========================================

  function getStageSpeedSettings(stageNumber) {

    // 1스테이지: 느린 속도
    if (stageNumber === 1) {
      return {
        initial: Math.hypot(2.8, 3.2),
        acceleration: 0.10,
        maximum: 7.5
      };
    }

    // 2스테이지: 기존 속도
    if (stageNumber === 2) {
      return {
        initial: Math.hypot(3.5, 4),
        acceleration: 0.2,
        maximum: 13
      };
    }

    // 3스테이지 이상: 점점 빨라짐
    const extraStages = stageNumber - 2;

    return {
      initial: Math.min(
        Math.hypot(3.5, 4) + extraStages * 0.8,
        12
      ),

      acceleration: Math.min(
        0.2 + extraStages * 0.08,
        0.8
      ),

      maximum: Math.min(
        13 + extraStages * 2,
        23
      )
    };
  }

  const paddle = {
    width: 105,
    height: 13,
    x: W / 2 - 52,
    y: H - 35,
    speed: 8
  };

  const ball = {
    x: W / 2,
    y: H - 55,
    radius: 8,
    dx: 3.5,
    dy: -4
  };

  const brickRows = 5;
  const brickColumns = 9;
  const brickWidth = 53;
  const brickHeight = 19;
  const brickGap = 9;
  const brickTop = 55;
  const brickLeft = 22;

  const patternNames = [
    "전체 벽돌",
    "체커보드 배치",
    "테두리 배치",
    "다이아몬드 배치",
    "세로 기둥 배치"
  ];

  let bricks = [];
  let score = 0;
  let lives = 1;
  let stage = 1;

  let running = false;
  let animationId = null;
  let pointerX = null;

  // 공 발사 대기 상태
  let waitingForLaunch = true;

  // 스테이지별 가속 시작 시간
  let gameStartedAt = null;

  // ==========================================
  // 현재 스테이지 공 속도 계산
  // ==========================================

  function getBallSpeed() {
    const settings = getStageSpeedSettings(stage);

    if (gameStartedAt === null) {
      return settings.initial;
    }

    const elapsed =
      (performance.now() - gameStartedAt) / 1000;

    return Math.min(
      settings.initial +
      elapsed * settings.acceleration,
      settings.maximum
    );
  }

  // 현재 방향을 유지하면서 속도 적용
  function applyBallSpeed() {
    const currentSpeed = Math.hypot(ball.dx, ball.dy);

    if (currentSpeed === 0) return;

    const targetSpeed = getBallSpeed();

    ball.dx = (ball.dx / currentSpeed) * targetSpeed;
    ball.dy = (ball.dy / currentSpeed) * targetSpeed;
  }

  // ==========================================
  // 5가지 벽돌 배치 생성
  // ==========================================

  function createBricks() {
    bricks = [];

    const pattern = (stage - 1) % 5;

    for (let row = 0; row < brickRows; row++) {
      for (let col = 0; col < brickColumns; col++) {

        let shouldExist = false;

        // 패턴 1: 전체 벽돌
        if (pattern === 0) {
          shouldExist = true;
        }

        // 패턴 2: 체커보드
        else if (pattern === 1) {
          shouldExist = (row + col) % 2 === 0;
        }

        // 패턴 3: 테두리
        else if (pattern === 2) {
          shouldExist =
            row === 0 ||
            row === brickRows - 1 ||
            col === 0 ||
            col === brickColumns - 1;
        }

        // 패턴 4: 다이아몬드
        else if (pattern === 3) {
          shouldExist =
            Math.abs(col - 4) +
            Math.abs(row - 2) * 2 <= 6;
        }

        // 패턴 5: 세로 기둥
        else if (pattern === 4) {
          shouldExist =
            col % 2 === 0 ||
            row === 0 ||
            row === brickRows - 1;
        }

        if (!shouldExist) continue;

        bricks.push({
          x: brickLeft + col * (brickWidth + brickGap),
          y: brickTop + row * (brickHeight + brickGap),
          width: brickWidth,
          height: brickHeight,
          alive: true,
          color: (row + stage - 1) % 5
        });
      }
    }
  }

  // ==========================================
  // 공 위치 초기화 및 발사
  // ==========================================

  function resetBall() {
    ball.x = paddle.x + paddle.width / 2;
    ball.y = paddle.y - 15;

    ball.dx = 0;
    ball.dy = 0;

    waitingForLaunch = true;
    gameStartedAt = null;
  }

  function launchBall() {
    if (!waitingForLaunch || lives <= 0) return;

    const settings = getStageSpeedSettings(stage);
    const speed = settings.initial;

    const direction =
      Math.random() < 0.5 ? -1 : 1;

    const baseSpeed = Math.hypot(3.5, 4);

    ball.dx = speed * (3.5 / baseSpeed) * direction;
    ball.dy = -speed * (4 / baseSpeed);

    waitingForLaunch = false;
    gameStartedAt = performance.now();

    running = true;

    message.textContent =
      `STAGE ${stage} 진행 중! ${patternNames[(stage - 1) % 5]}`;

    startButton.textContent = "게임 진행 중";

    if (animationId === null) {
      update();
    }
  }

  function updateScore() {
    scoreText.textContent = score;
    stageText.textContent = stage;
  }

  // ==========================================
  // 배경
  // ==========================================

  function drawBackground() {
    ctx.fillStyle = "#08111f";
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "rgba(231,196,119,0.08)";
    ctx.lineWidth = 1;

    for (let x = 0; x < W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
  }

  // ==========================================
  // 벽돌 그리기
  // ==========================================

  function drawBricks() {
    const colors = [
      "#e7c477",
      "#d8a85d",
      "#c18c4b",
      "#a9753e",
      "#8b642b"
    ];

    bricks.forEach((brick) => {
      if (!brick.alive) return;

      ctx.fillStyle = colors[brick.color];

      ctx.beginPath();
      ctx.roundRect(
        brick.x,
        brick.y,
        brick.width,
        brick.height,
        5
      );

      ctx.fill();
    });
  }

  // ==========================================
  // 패들
  // ==========================================

  function drawPaddle() {
    ctx.fillStyle = "#e7c477";

    ctx.beginPath();
    ctx.roundRect(
      paddle.x,
      paddle.y,
      paddle.width,
      paddle.height,
      8
    );

    ctx.fill();
  }

  // ==========================================
  // 공
  // ==========================================

  function drawBall() {
    ctx.beginPath();

    ctx.arc(
      ball.x,
      ball.y,
      ball.radius,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#fff0c5";
    ctx.shadowColor = "#e7c477";
    ctx.shadowBlur = 12;

    ctx.fill();

    ctx.shadowBlur = 0;
  }

  function draw() {
    drawBackground();
    drawBricks();
    drawPaddle();
    drawBall();
  }

  // ==========================================
  // 패들 이동
  // ==========================================

  function movePaddle() {
    if (pointerX !== null) {
      paddle.x = pointerX - paddle.width / 2;
    }

    paddle.x = Math.max(
      0,
      Math.min(W - paddle.width, paddle.x)
    );

    // 공이 대기 중이면 패들을 따라 이동
    if (waitingForLaunch) {
      ball.x = paddle.x + paddle.width / 2;
      ball.y = paddle.y - 15;
    }
  }

  // ==========================================
  // 벽돌 충돌
  // ==========================================

  function checkBrickCollision() {
    for (const brick of bricks) {
      if (!brick.alive) continue;

      if (
        ball.x + ball.radius > brick.x &&
        ball.x - ball.radius < brick.x + brick.width &&
        ball.y + ball.radius > brick.y &&
        ball.y - ball.radius < brick.y + brick.height
      ) {
        brick.alive = false;
        ball.dy *= -1;

        score += 10;
        updateScore();

        break;
      }
    }
  }

  // ==========================================
  // 스테이지 클리어
  // ==========================================

  function checkWin() {
    if (bricks.every((brick) => !brick.alive)) {

      running = false;
      waitingForLaunch = true;

      if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }

      // 다음 스테이지
      stage++;

      createBricks();

      // 공을 패들 위에 정지
      resetBall();

      updateScore();

      const currentPattern =
        patternNames[(stage - 1) % 5];

      message.textContent =
        `STAGE ${stage} 클리어! ${currentPattern} 등장! 화면을 클릭해 공을 발사하세요.`;

      startButton.textContent = "다음 스테이지 시작";

      draw();

      return true;
    }

    return false;
  }

  // ==========================================
  // 게임 오버
  // ==========================================

  function loseLife() {
    lives = 0;
    running = false;
    waitingForLaunch = false;

    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }

    message.textContent =
      "GAME OVER! 다시 도전해 보세요.";

    startButton.textContent = "다시 도전";
  }

  // ==========================================
  // 게임 업데이트
  // ==========================================

  function update() {
    if (!running) {
      animationId = null;
      return;
    }

    animationId = null;

    movePaddle();

    // 시간이 지날수록 공 가속
    applyBallSpeed();

    ball.x += ball.dx;
    ball.y += ball.dy;

    // 좌우 벽 충돌
    if (ball.x + ball.radius >= W) {
      ball.x = W - ball.radius;
      ball.dx = -Math.abs(ball.dx);
    }

    if (ball.x - ball.radius <= 0) {
      ball.x = ball.radius;
      ball.dx = Math.abs(ball.dx);
    }

    // 위쪽 벽 충돌
    if (ball.y - ball.radius <= 0) {
      ball.y = ball.radius;
      ball.dy = Math.abs(ball.dy);
    }

    // 패들과 공 충돌
    if (
      ball.dy > 0 &&
      ball.y + ball.radius >= paddle.y &&
      ball.y - ball.radius <= paddle.y + paddle.height &&
      ball.x + ball.radius >= paddle.x &&
      ball.x - ball.radius <= paddle.x + paddle.width
    ) {
      const hitPosition =
        (ball.x - (paddle.x + paddle.width / 2)) /
        (paddle.width / 2);

      const angle =
        Math.max(-1, Math.min(1, hitPosition)) *
        (Math.PI / 3);

      const speed = getBallSpeed();

      ball.dx = speed * Math.sin(angle);
      ball.dy = -speed * Math.cos(angle);

      ball.y = paddle.y - ball.radius;
    }

    // 공이 바닥에 떨어짐
    if (ball.y - ball.radius > H) {
      loseLife();
      draw();
      return;
    }

    checkBrickCollision();

    // 모든 벽돌 제거 확인
    if (checkWin()) {
      return;
    }

    draw();

    animationId = requestAnimationFrame(update);
  }

  // ==========================================
  // 게임 시작
  // ==========================================

  function startGame() {
    if (running) return;

    // 게임 오버 상태라면 처음부터 다시 시작
    if (lives <= 0) {
      resetGame();
    }

    // 대기 중인 공 발사
    launchBall();
  }

  // ==========================================
  // 게임 초기화
  // ==========================================

  function resetGame() {
    running = false;

    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }

    score = 0;
    lives = 1;
    stage = 1;

    gameStartedAt = null;
    pointerX = null;

    paddle.x = W / 2 - paddle.width / 2;

    createBricks();
    resetBall();
    updateScore();

    message.textContent =
      "시작 버튼을 눌러 도전하세요!";

    startButton.textContent = "게임 시작";

    draw();
  }

  // ==========================================
  // 마우스 및 터치 위치 계산
  // ==========================================

  function setPointerPosition(event) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;

    pointerX =
      (event.clientX - rect.left) * scaleX;
  }

  canvas.addEventListener("pointerdown", (event) => {
    canvas.setPointerCapture(event.pointerId);

    setPointerPosition(event);

    // 대기 상태에서 클릭하면 공 발사
    if (waitingForLaunch && lives > 0) {
      launchBall();
    }

    movePaddle();
    draw();
  });

  canvas.addEventListener("pointermove", (event) => {
    if (
      event.pointerType === "mouse" ||
      event.buttons > 0 ||
      event.pressure > 0
    ) {
      setPointerPosition(event);
      movePaddle();

      if (!running) {
        draw();
      }
    }
  });

  canvas.addEventListener("pointerup", () => {
    pointerX = null;
  });

  canvas.addEventListener("pointercancel", () => {
    pointerX = null;
  });

  // ==========================================
  // 키보드 조작
  // ==========================================

  document.addEventListener("keydown", (event) => {
    if (event.key === "ArrowLeft") {
      event.preventDefault();
      paddle.x -= paddle.speed;
    }

    if (event.key === "ArrowRight") {
      event.preventDefault();
      paddle.x += paddle.speed;
    }

    paddle.x = Math.max(
      0,
      Math.min(W - paddle.width, paddle.x)
    );

    // 대기 중에는 공도 패들을 따라감
    if (waitingForLaunch) {
      ball.x = paddle.x + paddle.width / 2;
      ball.y = paddle.y - 15;
    }

    if (!running) {
      draw();
    }
  });

  // ==========================================
  // 버튼 이벤트
  // ==========================================

  startButton.addEventListener("click", startGame);
  resetButton.addEventListener("click", resetGame);

  // ==========================================
  // 최초 실행
  // ==========================================

  createBricks();
  resetBall();
  updateScore();
  draw();

})();
</script>
</body>
</html>

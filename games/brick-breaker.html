
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>벽돌 깨기 | 카지노</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 14px;
  background: radial-gradient(ellipse at top, #1b2b43, #0b1220 65%);
  color: #fff0c5;
  font-family: Arial, "Noto Sans KR", sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  padding: 25px;
  border: 1px solid #9b7840;
  border-radius: 25px;
  background: rgba(9, 17, 31, 0.8);
}

.eyebrow {
  color: #e7c477;
  letter-spacing: 4px;
  font-size: 13px;
  font-weight: bold;
}

h1 {
  margin: 15px 0 8px;
  font-size: 36px;
}

.description {
  color: #aebbd0;
  line-height: 1.6;
}

.scoreboard {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 24px 0 15px;
}

.score-box {
  flex: 1;
  max-width: 220px;
  padding: 12px 5px;
  border: 1px solid #9b7840;
  border-radius: 12px;
  background: #192941;
  min-width: 0;
}

.score-box small {
  display: block;
  color: #aebbd0;
  margin-bottom: 6px;
}

.score-box strong {
  font-size: 22px;
  color: #e7c477;
}

.game-wrap {
  position: relative;
  width: 100%;
  overflow: hidden;
  border: 1px solid #9b7840;
  border-radius: 15px;
  background: #08111f;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  touch-action: none;
}

.message {
  margin: 16px 0;
  min-height: 25px;
  color: #e7c477;
  font-weight: bold;
  line-height: 1.6;
}

button {
  border: 1px solid #e7c477;
  border-radius: 30px;
  padding: 13px 17px;
  margin: 5px;
  background: #192941;
  color: #fff0c5;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #8b642b;
}

#specialButton {
  border-color: #48e878;
  color: #8dffab;
}

#specialButton:hover {
  background: #176b39;
}

.back {
  display: inline-block;
  margin-top: 18px;
  color: #aebbd0;
  text-decoration: none;
}

@media (max-width: 420px) {
  .container {
    padding: 18px 12px;
  }

  .score-box {
    padding: 10px 3px;
  }

  .score-box strong {
    font-size: 19px;
  }

  button {
    padding: 12px 13px;
    font-size: 14px;
  }
}
</style>
</head>

<body>
<div class="container">

  <div class="eyebrow">CASINO MINI GAME 02</div>

  <h1>벽돌 깨기</h1>

  <p class="description">
    공을 튕겨 모든 벽돌을 제거하세요!
  </p>

  <div class="scoreboard">
    <div class="score-box">
      <small>SCORE</small>
      <strong id="score">0</strong>
    </div>

    <div class="score-box">
      <small>STAGE</small>
      <strong id="stage">1</strong>
    </div>
  </div>

  <div class="game-wrap">
    <canvas id="game" width="600" height="450"></canvas>
  </div>

  <div class="message" id="message">
    시작 버튼을 눌러 도전하세요!
  </div>

  <button id="startButton">게임 시작</button>
  <button id="specialButton">특별 스테이지</button>
  <button id="resetButton">다시 시작</button>

  <a class="back" href="../index.html">
    ← 카지노 메인으로 돌아가기
  </a>

</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const scoreText = document.getElementById("score");
  const stageText = document.getElementById("stage");
  const message = document.getElementById("message");

  const startButton = document.getElementById("startButton");
  const specialButton = document.getElementById("specialButton");
  const resetButton = document.getElementById("resetButton");

  const W = canvas.width;
  const H = canvas.height;

  // ==========================================
  // 스테이지별 속도 설정
  // ==========================================

  function getStageSpeedSettings(stageNumber) {
    if (stageNumber === 1) {
      return {
        initial: Math.hypot(2.8, 3.2),
        acceleration: 0.10,
        maximum: 7.5
      };
    }

    if (stageNumber === 2) {
      return {
        initial: Math.hypot(3.5, 4),
        acceleration: 0.2,
        maximum: 13
      };
    }

    const extraStages = stageNumber - 2;

    return {
      initial: Math.min(
        Math.hypot(3.5, 4) + extraStages * 0.8,
        12
      ),
      acceleration: Math.min(
        0.2 + extraStages * 0.08,
        0.8
      ),
      maximum: Math.min(
        13 + extraStages * 2,
        23
      )
    };
  }

  // ==========================================
  // 기본 설정
  // ==========================================

  const paddle = {
    width: 105,
    height: 13,
    x: W / 2 - 52,
    y: H - 35,
    speed: 8
  };

  const brickRows = 5;
  const brickColumns = 9;
  const brickWidth = 53;
  const brickHeight = 19;
  const brickGap = 9;
  const brickTop = 55;
  const brickLeft = 22;

  const patternNames = [
    "전체 벽돌",
    "체커보드 배치",
    "테두리 배치",
    "다이아몬드 배치",
    "세로 기둥 배치"
  ];

  const normalColors = [
    "#e7c477",
    "#d8a85d",
    "#c18c4b",
    "#a9753e",
    "#8b642b"
  ];

  const specialColors = [
    "#28ef45",
    "#22d83d",
    "#16c934",
    "#48ff5d",
    "#0bb82b"
  ];

  let bricks = [];
  let balls = [];
  let powerUps = [];

  let score = 0;
  let stage = 1;
  let lives = 1;

  let running = false;
  let waitingForLaunch = true;
  let animationId = null;

  let pointerX = null;
  let gameStartedAt = null;

  let gameMode = "normal";

  // ==========================================
  // 공 생성
  // ==========================================

  function createBall(x, y, dx, dy) {
    return {
      x,
      y,
      radius: 8,
      dx,
      dy
    };
  }

  function getBallSpeed() {
    const settings = getStageSpeedSettings(stage);

    if (gameStartedAt === null) {
      return settings.initial;
    }

    const elapsed =
      (performance.now() - gameStartedAt) / 1000;

    return Math.min(
      settings.initial +
      elapsed * settings.acceleration,
      settings.maximum
    );
  }

  function applyBallSpeed(ball) {
    if (gameMode !== "normal") return;

    const currentSpeed = Math.hypot(ball.dx, ball.dy);

    if (currentSpeed === 0) return;

    const targetSpeed = getBallSpeed();

    ball.dx = ball.dx / currentSpeed * targetSpeed;
    ball.dy = ball.dy / currentSpeed * targetSpeed;
  }

  // ==========================================
  // 일반 스테이지 벽돌
  // ==========================================

  function createBricks() {
    bricks = [];

    const pattern = (stage - 1) % 5;

    for (let row = 0; row < brickRows; row++) {
      for (let col = 0; col < brickColumns; col++) {
        let shouldExist = false;

        if (pattern === 0) {
          shouldExist = true;
        } else if (pattern === 1) {
          shouldExist = (row + col) % 2 === 0;
        } else if (pattern === 2) {
          shouldExist =
            row === 0 ||
            row === brickRows - 1 ||
            col === 0 ||
            col === brickColumns - 1;
        } else if (pattern === 3) {
          shouldExist =
            Math.abs(col - 4) +
            Math.abs(row - 2) * 2 <= 6;
        } else if (pattern === 4) {
          shouldExist =
            col % 2 === 0 ||
            row === 0 ||
            row === brickRows - 1;
        }

        if (!shouldExist) continue;

        bricks.push({
          x: brickLeft + col * (brickWidth + brickGap),
          y: brickTop + row * (brickHeight + brickGap),
          width: brickWidth,
          height: brickHeight,
          alive: true,
          indestructible: false,
          color: (row + stage - 1) % 5
        });
      }
    }
  }

  // ==========================================
  // 특별 스테이지
  // ==========================================

  function createSpecialStage() {
    bricks = [];
    powerUps = [];
    balls = [];

    // 초록색 벽돌 격자
    const columns = 16;
    const rows = 9;

    const width = 31;
    const height = 13;
    const gap = 5;

    const totalWidth =
      columns * width + (columns - 1) * gap;

    const left = (W - totalWidth) / 2;

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < columns; col++) {
        bricks.push({
          x: left + col * (width + gap),
          y: 35 + row * (height + gap),
          width,
          height,
          alive: true,
          indestructible: false,
          color: Math.floor(Math.random() * specialColors.length)
        });
      }
    }

    // 남색 장애물 벽
    // 가로 벽 왼쪽
    bricks.push({
      x: 20,
      y: 245,
      width: 230,
      height: 17,
      alive: true,
      indestructible: true
    });

    // 가로 벽 오른쪽
    bricks.push({
      x: 350,
      y: 245,
      width: 230,
      height: 17,
      alive: true,
      indestructible: true
    });

    // 세로 벽 왼쪽
    bricks.push({
      x: 250,
      y: 245,
      width: 17,
      height: 100,
      alive: true,
      indestructible: true
    });

    // 세로 벽 오른쪽
    bricks.push({
      x: 333,
      y: 245,
      width: 17,
      height: 100,
      alive: true,
      indestructible: true
    });

    // 아래쪽 중앙 장애물
    bricks.push({
      x: 267,
      y: 345,
      width: 66,
      height: 15,
      alive: true,
      indestructible: true
    });
  }

  // ==========================================
  // 공 초기화 및 발사 대기
  // ==========================================

  function resetBall() {
    balls = [
      createBall(
        paddle.x + paddle.width / 2,
        paddle.y - 15,
        0,
        0
      )
    ];

    waitingForLaunch = true;
    gameStartedAt = null;
  }

  function launchBall() {
    if (!waitingForLaunch || lives <= 0) return;

    const settings = getStageSpeedSettings(stage);
    const speed = settings.initial;

    const direction = Math.random() < 0.5 ? -1 : 1;
    const baseSpeed = Math.hypot(3.5, 4);

    balls = [
      createBall(
        paddle.x + paddle.width / 2,
        paddle.y - 15,
        speed * 3.5 / baseSpeed * direction,
        -speed * 4 / baseSpeed
      )
    ];

    waitingForLaunch = false;
    gameStartedAt = performance.now();
    running = true;

    message.textContent =
      gameMode === "special"
        ? "특별 스테이지 진행 중! 아이템을 획득하세요!"
        : `STAGE ${stage} 진행 중! ${patternNames[(stage - 1) % 5]}`;

    startButton.textContent = "게임 진행 중";

    if (animationId === null) {
      update();
    }
  }

  // ==========================================
  // 점수 및 화면 정보
  // ==========================================

  function updateScore() {
    scoreText.textContent = score;
    stageText.textContent =
      gameMode === "special" ? "SPECIAL" : stage;
  }

  // ==========================================
  // 배경
  // ==========================================

  function drawBackground() {
    ctx.fillStyle = "#08111f";
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "rgba(231,196,119,0.08)";
    ctx.lineWidth = 1;

    for (let x = 0; x < W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
  }

  // ==========================================
  // 벽돌 그리기
  // ==========================================

  function drawBricks() {
    bricks.forEach((brick) => {
      if (!brick.alive) return;

      if (brick.indestructible) {
        ctx.fillStyle = "#151d43";
        ctx.strokeStyle = "#151d43";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.roundRect(
          brick.x,
          brick.y,
          brick.width,
          brick.height,
          3
        );
        ctx.fill();
        ctx.stroke();

      } else if (gameMode === "special") {
        ctx.fillStyle = specialColors[brick.color];

        ctx.fillRect(
          brick.x,
          brick.y,
          brick.width,
          brick.height
        );

        ctx.strokeStyle = "rgba(0,0,0,0.4)";
        ctx.lineWidth = 1;
        ctx.strokeRect(
          brick.x,
          brick.y,
          brick.width,
          brick.height
        );

      } else {
        ctx.fillStyle = normalColors[brick.color];

        ctx.beginPath();
        ctx.roundRect(
          brick.x,
          brick.y,
          brick.width,
          brick.height,
          5
        );
        ctx.fill();
      }
    });
  }

  // ==========================================
  // 아이템 그리기
  // ==========================================

  function drawPowerUps() {
    powerUps.forEach((item) => {
      ctx.save();

      ctx.beginPath();
      ctx.arc(
        item.x + item.width / 2,
        item.y + item.height / 2,
        14,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        item.type === "plus" ? "#1689ed" : "#0874c9";

      ctx.shadowColor = "#ffffff";
      ctx.shadowBlur = 9;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 16px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillText(
        item.type === "plus" ? "+3" : "×3",
        item.x + item.width / 2,
        item.y + item.height / 2
      );

      ctx.restore();
    });
  }

  // ==========================================
  // 패들
  // ==========================================

  function drawPaddle() {
    ctx.fillStyle = "#e7c477";

    ctx.beginPath();
    ctx.roundRect(
      paddle.x,
      paddle.y,
      paddle.width,
      paddle.height,
      8
    );

    ctx.fill();
  }

  // ==========================================
  // 공
  // ==========================================

  function drawBalls() {
    balls.forEach((ball) => {
      ctx.beginPath();
      ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "#fff0c5";
      ctx.shadowColor = "#e7c477";
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    });
  }

  function draw() {
    drawBackground();
    drawBricks();
    drawPowerUps();
    drawPaddle();
    drawBalls();
  }

  // ==========================================
  // 패들 이동
  // ==========================================

  function movePaddle() {
    if (pointerX !== null) {
      paddle.x = pointerX - paddle.width / 2;
    }

    paddle.x = Math.max(
      0,
      Math.min(W - paddle.width, paddle.x)
    );

    if (waitingForLaunch && balls.length === 1) {
      balls[0].x = paddle.x + paddle.width / 2;
      balls[0].y = paddle.y - 15;
    }
  }

  // ==========================================
  // 벽돌 충돌
  // ==========================================

  function checkBrickCollision(ball) {
    for (const brick of bricks) {
      if (!brick.alive) continue;

      const collided =
        ball.x + ball.radius > brick.x &&
        ball.x - ball.radius < brick.x + brick.width &&
        ball.y + ball.radius > brick.y &&
        ball.y - ball.radius < brick.y + brick.height;

      if (!collided) continue;

      if (brick.indestructible) {
        const overlapLeft =
          ball.x + ball.radius - brick.x;

        const overlapRight =
          brick.x + brick.width - (ball.x - ball.radius);

        const overlapTop =
          ball.y + ball.radius - brick.y;

        const overlapBottom =
          brick.y + brick.height - (ball.y - ball.radius);

        const minOverlap = Math.min(
          overlapLeft,
          overlapRight,
          overlapTop,
          overlapBottom
        );

        if (
          minOverlap === overlapLeft ||
          minOverlap === overlapRight
        ) {
          ball.dx *= -1;

          if (minOverlap === overlapLeft) {
            ball.x = brick.x - ball.radius;
          } else {
            ball.x = brick.x + brick.width + ball.radius;
          }

        } else {
          ball.dy *= -1;

          if (minOverlap === overlapTop) {
            ball.y = brick.y - ball.radius;
          } else {
            ball.y = brick.y + brick.height + ball.radius;
          }
        }

        return;
      }

      // 파괴 가능한 벽돌
      brick.alive = false;
      ball.dy *= -1;

      score += 10;
      updateScore();

      if (gameMode === "special") {
        dropPowerUp(
          brick.x + brick.width / 2 - 14,
          brick.y + brick.height / 2 - 14
        );
      }

      return;
    }
  }

  // ==========================================
  // 패들 충돌
  // ==========================================

  function checkPaddleCollision(ball) {
    if (
      ball.dy > 0 &&
      ball.y + ball.radius >= paddle.y &&
      ball.y - ball.radius <= paddle.y + paddle.height &&
      ball.x + ball.radius >= paddle.x &&
      ball.x - ball.radius <= paddle.x + paddle.width
    ) {
      const hitPosition =
        (ball.x - (paddle.x + paddle.width / 2)) /
        (paddle.width / 2);

      const angle =
        Math.max(-1, Math.min(1, hitPosition)) *
        (Math.PI / 3);

      const speed = Math.hypot(ball.dx, ball.dy);

      ball.dx = speed * Math.sin(angle);
      ball.dy = -speed * Math.cos(angle);

      ball.y = paddle.y - ball.radius;
    }
  }

  // ==========================================
  // 아이템 드롭
  // ==========================================

  function dropPowerUp(x, y) {
    if (gameMode !== "special") return;

    const chance = Math.random();

    // 전체 아이템 등장 확률 20%
    if (chance >= 0.20) return;

    const type = chance < 0.10 ? "plus" : "triple";

    powerUps.push({
      x,
      y,
      width: 28,
      height: 28,
      speed: 2.5,
      type
    });
  }

  // ==========================================
  // +3 : 공 3개 추가
  // ==========================================

  function addThreeBalls() {
    const baseX = paddle.x + paddle.width / 2;
    const baseY = paddle.y - 15;

    const directions = [-0.55, 0, 0.55];

    directions.forEach((angle) => {
      const speed = 5.5;

      balls.push(
        createBall(
          baseX,
          baseY,
          speed * Math.sin(angle),
          -speed * Math.cos(angle)
        )
      );
    });

    message.textContent =
      "🎉 +3 획득! 패들에서 공 3개가 추가됐습니다!";
  }

  // ==========================================
  // ×3 : 공 분열
  // ==========================================

  function splitBall(targetBall) {
    const speed = Math.hypot(
      targetBall.dx,
      targetBall.dy
    );

    if (speed === 0) return;

    const angle = Math.atan2(
      targetBall.dy,
      targetBall.dx
    );

    const spread = 0.38;
    const newBalls = [];

    for (let i = -1; i <= 1; i++) {
      const newAngle = angle + spread * i;

      newBalls.push(
        createBall(
          targetBall.x,
          targetBall.y,
          Math.cos(newAngle) * speed,
          Math.sin(newAngle) * speed
        )
      );
    }

    const index = balls.indexOf(targetBall);

    if (index !== -1) {
      balls.splice(index, 1, ...newBalls);
    }

    message.textContent =
      "⚡ ×3 획득! 공이 현재 위치에서 3개로 분열했습니다!";
  }

  // ==========================================
  // 아이템 획득
  // ==========================================

  function checkPowerUpCollision() {
    for (let i = powerUps.length - 1; i >= 0; i--) {
      const item = powerUps[i];

      item.y += item.speed;

      const caught =
        item.x + item.width > paddle.x &&
        item.x < paddle.x + paddle.width &&
        item.y + item.height >= paddle.y &&
        item.y <= paddle.y + paddle.height;

      if (caught) {
        if (item.type === "plus") {
          addThreeBalls();

        } else {
          // 아이템을 잡았을 때 가장 가까운 공을 분열
          let nearestBall = null;
          let nearestDistance = Infinity;

          balls.forEach((ball) => {
            const distance = Math.hypot(
              ball.x - (item.x + item.width / 2),
              ball.y - (item.y + item.height / 2)
            );

            if (distance < nearestDistance) {
              nearestDistance = distance;
              nearestBall = ball;
            }
          });

          if (nearestBall) {
            splitBall(nearestBall);
          }
        }

        powerUps.splice(i, 1);
        continue;
      }

      if (item.y > H) {
        powerUps.splice(i, 1);
      }
    }
  }

  // ==========================================
  // 일반 스테이지 클리어
  // ==========================================

  function checkNormalWin() {
    const remaining = bricks.some(
      (brick) => brick.alive
    );

    if (remaining) return false;

    running = false;
    waitingForLaunch = true;

    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }

    stage++;

    createBricks();
    resetBall();
    updateScore();

    const currentPattern =
      patternNames[(stage - 1) % 5];

    message.textContent =
      `STAGE ${stage} 시작! ${currentPattern} 등장! 화면을 클릭해 공을 발사하세요.`;

    startButton.textContent = "다음 스테이지 시작";

    draw();

    return true;
  }

  // ==========================================
  // 특별 스테이지 클리어
  // ==========================================

  function checkSpecialWin() {
    const remaining = bricks.some(
      (brick) => brick.alive && !brick.indestructible
    );

    if (remaining) return false;

    running = false;
    waitingForLaunch = true;

    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }

    message.textContent =
      "특별 스테이지 클리어! 다시 시작 버튼으로 일반 게임에 돌아갈 수 있어.";

    startButton.textContent = "특별 스테이지 완료";

    draw();

    return true;
  }

  // ==========================================
  // 게임 오버
  // ==========================================

  function loseLife() {
    lives = 0;
    running = false;
    waitingForLaunch = false;

    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }

    balls = [];

    message.textContent =
      "GAME OVER! 다시 도전해 보세요.";

    startButton.textContent = "다시 도전";
  }

  // ==========================================
  // 게임 업데이트
  // ==========================================

  function update() {
    if (!running) {
      animationId = null;
      return;
    }

    animationId = null;

    movePaddle();

    checkPowerUpCollision();

    // 여러 공 이동
    for (let i = balls.length - 1; i >= 0; i--) {
      const ball = balls[i];

      if (gameMode === "normal") {
        applyBallSpeed(ball);
      }

      ball.x += ball.dx;
      ball.y += ball.dy;

      // 좌우 벽
      if (ball.x + ball.radius >= W) {
        ball.x = W - ball.radius;
        ball.dx = -Math.abs(ball.dx);
      }

      if (ball.x - ball.radius <= 0) {
        ball.x = ball.radius;
        ball.dx = Math.abs(ball.dx);
      }

      // 위쪽 벽
      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.dy = Math.abs(ball.dy);
      }

      // 패들
      checkPaddleCollision(ball);

      // 바닥에 떨어진 공 제거
      if (ball.y - ball.radius > H) {
        balls.splice(i, 1);
        continue;
      }

      // 벽돌
      checkBrickCollision(ball);
    }

    // 모든 공이 사라지면 게임 오버
    if (balls.length === 0) {
      loseLife();
      draw();
      return;
    }

    if (
      gameMode === "normal" &&
      checkNormalWin()
    ) {
      return;
    }

    if (
      gameMode === "special" &&
      checkSpecialWin()
    ) {
      return;
    }

    draw();

    animationId = requestAnimationFrame(update);
  }

  // ==========================================
  // 게임 시작
  // ==========================================

  function startGame() {
    if (running) return;

    if (lives <= 0) {
      resetGame();
    }

    if (waitingForLaunch) {
      launchBall();
    }
  }

  // ==========================================
  // 특별 스테이지 시작
  // ==========================================

  function startSpecialStage() {
    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }

    running = false;
    gameMode = "special";

    score = 0;
    lives = 1;
    stage = 1;

    pointerX = null;
    gameStartedAt = null;

    paddle.x = W / 2 - paddle.width / 2;

    createSpecialStage();
    resetBall();
    updateScore();

    message.textContent =
      "특별 스테이지! 화면을 클릭하거나 시작 버튼을 눌러 공을 발사하세요.";

    startButton.textContent = "특별 스테이지 시작";

    draw();
  }

  // ==========================================
  // 게임 초기화
  // ==========================================

  function resetGame() {
    running = false;

    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }

    gameMode = "normal";

    score = 0;
    lives = 1;
    stage = 1;

    gameStartedAt = null;
    pointerX = null;

    powerUps = [];

    paddle.x = W / 2 - paddle.width / 2;

    createBricks();
    resetBall();
    updateScore();

    message.textContent =
      "시작 버튼을 눌러 도전하세요!";

    startButton.textContent = "게임 시작";

    draw();
  }

  // ==========================================
  // 마우스 및 터치 조작
  // ==========================================

  function setPointerPosition(event) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;

    pointerX =
      (event.clientX - rect.left) * scaleX;
  }

  canvas.addEventListener("pointerdown", (event) => {
    canvas.setPointerCapture(event.pointerId);

    setPointerPosition(event);

    if (waitingForLaunch && lives > 0) {
      launchBall();
    }

    movePaddle();
    draw();
  });

  canvas.addEventListener("pointermove", (event) => {
    if (
      event.pointerType === "mouse" ||
      event.buttons > 0 ||
      event.pressure > 0
    ) {
      setPointerPosition(event);
      movePaddle();

      if (!running) {
        draw();
      }
    }
  });

  canvas.addEventListener("pointerup", () => {
    pointerX = null;
  });

  canvas.addEventListener("pointercancel", () => {
    pointerX = null;
  });

  // ==========================================
  // 키보드 조작
  // ==========================================

  document.addEventListener("keydown", (event) => {
    if (event.key === "ArrowLeft") {
      event.preventDefault();
      paddle.x -= paddle.speed;
    }

    if (event.key === "ArrowRight") {
      event.preventDefault();
      paddle.x += paddle.speed;
    }

    paddle.x = Math.max(
      0,
      Math.min(W - paddle.width, paddle.x)
    );

    if (waitingForLaunch && balls.length === 1) {
      balls[0].x = paddle.x + paddle.width / 2;
      balls[0].y = paddle.y - 15;
    }

    if (!running) {
      draw();
    }
  });

  // ==========================================
  // 버튼 이벤트
  // ==========================================

  startButton.addEventListener("click", startGame);
  specialButton.addEventListener("click", startSpecialStage);
  resetButton.addEventListener("click", resetGame);

  // ==========================================
  // 최초 실행
  // ==========================================

  createBricks();
  resetBall();
  updateScore();
  draw();

})();
</script>
</body>
</html>

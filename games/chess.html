
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Chess AI | 카지노</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1220;
      color: #f5f0df;
      font-family: Arial, sans-serif;
    }

    .game {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    h1 { color: #e9c76b; }

    .description {
      color: #b8c0ce;
      line-height: 1.5;
    }

    .status {
      padding: 13px;
      margin: 18px 0;
      border: 1px solid #d6ad4c;
      border-radius: 10px;
      background: #17243a;
      font-weight: bold;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      width: 100%;
      aspect-ratio: 1;
      border: 4px solid #d6ad4c;
      border-radius: 5px;
      overflow: hidden;
    }

    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      border-radius: 0;
      font-size: clamp(23px, 8vw, 43px);
      cursor: pointer;
      user-select: none;
      aspect-ratio: 1;
    }

    .light { background: #e9d5ad; }
    .dark { background: #8b6546; }

    .selected {
      background: #d6c34c !important;
    }

    .possible::after {
      content: "";
      position: absolute;
      width: 22%;
      height: 22%;
      border-radius: 50%;
      background: #1b9b65aa;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .buttons button {
      flex: 1;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #e9c76b;
      color: #172033;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .back {
      display: inline-block;
      margin-top: 22px;
      color: #e9c76b;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>Chess AI</h1>
    <p class="description">
      흰색 말을 조작해 컴퓨터와 대결하세요.<br>
      상대 왕을 체크메이트하면 승리합니다!
    </p>

    <div class="status" id="status">흰색 차례</div>
    <div class="board" id="board"></div>

    <div class="buttons">
      <button id="restart">새 게임</button>
    </div>

    <a class="back" href="../index.html">← 카지노 메인으로</a>
  </main>

  <script>
    const boardElement = document.getElementById("board");
    const statusElement = document.getElementById("status");
    const restartButton = document.getElementById("restart");

    const symbols = {
      wk: "♔", wq: "♕", wr: "♖", wb: "♗", wn: "♘", wp: "♙",
      bk: "♚", bq: "♛", br: "♜", bb: "♝", bn: "♞", bp: "♟"
    };

    const initial = [
      ["br","bn","bb","bq","bk","bb","bn","br"],
      ["bp","bp","bp","bp","bp","bp","bp","bp"],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      ["wp","wp","wp","wp","wp","wp","wp","wp"],
      ["wr","wn","wb","wq","wk","wb","wn","wr"]
    ];

    let board;
    let selected = null;
    let legalMoves = [];
    let turn = "w";
    let gameOver = false;
    let aiThinking = false;

    const inside = (r,c) =>
      r >= 0 && r < 8 && c >= 0 && c < 8;

    const colorOf = piece => piece ? piece[0] : null;
    const typeOf = piece => piece ? piece[1] : null;

    function copyBoard(source) {
      return source.map(row => [...row]);
    }

    function resetGame() {
      board = copyBoard(initial);
      selected = null;
      legalMoves = [];
      turn = "w";
      gameOver = false;
      aiThinking = false;
      statusElement.textContent = "흰색 차례";
      render();
    }

    function pseudoMoves(state, r, c) {
      const piece = state[r][c];
      if (!piece) return [];

      const color = colorOf(piece);
      const type = typeOf(piece);
      const moves = [];

      const add = (nr,nc) => {
        if (!inside(nr,nc)) return false;

        const target = state[nr][nc];

        if (!target) {
          moves.push([nr,nc]);
          return true;
        }

        if (colorOf(target) !== color && typeOf(target) !== "k") {
          moves.push([nr,nc]);
        }

        return false;
      };

      if (type === "p") {
        const dir = color === "w" ? -1 : 1;
        const start = color === "w" ? 6 : 1;

        if (inside(r+dir,c) && !state[r+dir][c]) {
          moves.push([r+dir,c]);

          if (r === start && !state[r+2*dir][c]) {
            moves.push([r+2*dir,c]);
          }
        }

        for (const dc of [-1,1]) {
          const nr = r+dir;
          const nc = c+dc;

          if (
            inside(nr,nc) &&
            state[nr][nc] &&
            colorOf(state[nr][nc]) !== color &&
            typeOf(state[nr][nc]) !== "k"
          ) {
            moves.push([nr,nc]);
          }
        }
      }

      if (type === "n") {
        for (const [dr,dc] of [
          [-2,-1],[-2,1],[-1,-2],[-1,2],
          [1,-2],[1,2],[2,-1],[2,1]
        ]) add(r+dr,c+dc);
      }

      if (type === "k") {
        for (let dr=-1; dr<=1; dr++) {
          for (let dc=-1; dc<=1; dc++) {
            if (dr || dc) add(r+dr,c+dc);
          }
        }
      }

      if (["b","r","q"].includes(type)) {
        const directions = [];

        if (type === "b" || type === "q") {
          directions.push(
            [-1,-1],[-1,1],[1,-1],[1,1]
          );
        }

        if (type === "r" || type === "q") {
          directions.push(
            [-1,0],[1,0],[0,-1],[0,1]
          );
        }

        for (const [dr,dc] of directions) {
          let nr = r+dr;
          let nc = c+dc;

          while (inside(nr,nc)) {
            if (!add(nr,nc)) break;
            nr += dr;
            nc += dc;
          }
        }
      }

      return moves;
    }

    function findKing(state,color) {
      for (let r=0; r<8; r++) {
        for (let c=0; c<8; c++) {
          if (state[r][c] === color+"k") return [r,c];
        }
      }
      return null;
    }

    function isAttacked(state,r,c,byColor) {
      for (let sr=0; sr<8; sr++) {
        for (let sc=0; sc<8; sc++) {
          const piece = state[sr][sc];

          if (!piece || colorOf(piece) !== byColor) continue;

          const type = typeOf(piece);

          if (type === "p") {
            const dir = byColor === "w" ? -1 : 1;

            for (const dc of [-1,1]) {
              if (sr+dir === r && sc+dc === c) return true;
            }
          } else if (type === "k") {
            if (Math.max(Math.abs(sr-r),Math.abs(sc-c)) === 1) {
              return true;
            }
          } else {
            if (pseudoMoves(state,sr,sc).some(
              move => move[0] === r && move[1] === c
            )) return true;
          }
        }
      }

      return false;
    }

    function inCheck(state,color) {
      const king = findKing(state,color);
      if (!king) return true;

      return isAttacked(
        state,
        king[0],
        king[1],
        color === "w" ? "b" : "w"
      );
    }

    function makeMove(state,from,to) {
      const next = copyBoard(state);
      const [r,c] = from;
      const [nr,nc] = to;

      let piece = next[r][c];
      next[r][c] = null;

      if (piece[1] === "p" && (nr === 0 || nr === 7)) {
        piece = piece[0] + "q";
      }

      next[nr][nc] = piece;
      return next;
    }

    function allLegalMoves(state,color) {
      const result = [];

      for (let r=0; r<8; r++) {
        for (let c=0; c<8; c++) {
          const piece = state[r][c];

          if (!piece || colorOf(piece) !== color) continue;

          for (const move of pseudoMoves(state,r,c)) {
            const next = makeMove(state,[r,c],move);

            if (!inCheck(next,color)) {
              result.push({
                from:[r,c],
                to:move
              });
            }
          }
        }
      }

      return result;
    }

    function legalForPiece(r,c) {
      return pseudoMoves(board,r,c).filter(move => {
        const next = makeMove(board,[r,c],move);
        return !inCheck(next,turn);
      });
    }

    function evaluate(state) {
      const values = {
        p:100, n:320, b:330, r:500, q:900, k:20000
      };

      let score = 0;

      for (const row of state) {
        for (const piece of row) {
          if (!piece) continue;

          const value = values[typeOf(piece)];
          score += colorOf(piece) === "b" ? value : -value;
        }
      }

      return score;
    }

    function minimax(state,depth,alpha,beta,maximizing) {
      const color = maximizing ? "b" : "w";
      const moves = allLegalMoves(state,color);

      if (moves.length === 0) {
        if (inCheck(state,color)) {
          return maximizing ? -100000-depth : 100000+depth;
        }
        return 0;
      }

      if (depth === 0) return evaluate(state);

      if (maximizing) {
        let bestScore = -Infinity;

        for (const move of moves) {
          const next = makeMove(state,move.from,move.to);
          const value = minimax(next,depth-1,alpha,beta,false);

          bestScore = Math.max(bestScore,value);
          alpha = Math.max(alpha,value);

          if (beta <= alpha) break;
        }

        return bestScore;
      } else {
        let bestScore = Infinity;

        for (const move of moves) {
          const next = makeMove(state,move.from,move.to);
          const value = minimax(next,depth-1,alpha,beta,true);

          bestScore = Math.min(bestScore,value);
          beta = Math.min(beta,value);

          if (beta <= alpha) break;
        }

        return bestScore;
      }
    }

    function computerMove() {
      if (gameOver) return;

      aiThinking = true;
      statusElement.textContent = "컴퓨터가 생각 중...";

      setTimeout(() => {
        const moves = allLegalMoves(board,"b");

        if (moves.length === 0) {
          finishGame("b");
          return;
        }

        let bestScore = -Infinity;
        let choices = [];

        for (const move of moves) {
          const next = makeMove(board,move.from,move.to);
          const score = minimax(next,1,-Infinity,Infinity,false);

          if (score > bestScore) {
            bestScore = score;
            choices = [move];
          } else if (score === bestScore) {
            choices.push(move);
          }
        }

        const chosen = choices[
          Math.floor(Math.random()*choices.length)
        ];

        board = makeMove(board,chosen.from,chosen.to);
        aiThinking = false;

        turn = "w";
        checkGameState();
        render();
      }, 250);
    }

    function checkGameState() {
      const moves = allLegalMoves(board,turn);

      if (moves.length === 0) {
        finishGame(turn);
        return;
      }

      if (inCheck(board,turn)) {
        statusElement.textContent =
          turn === "w" ? "체크! 흰색 차례" : "체크! 검은색 차례";
      } else {
        statusElement.textContent =
          turn === "w" ? "흰색 차례" : "검은색 차례";
      }
    }

    function finishGame(color) {
      gameOver = true;
      aiThinking = false;

      if (inCheck(board,color)) {
        statusElement.textContent =
          color === "w" ? "체크메이트! 컴퓨터 승리" : "체크메이트! 플레이어 승리";
      } else {
        statusElement.textContent = "스테일메이트! 무승부";
      }

      render();
    }

    function handleClick(r,c) {
      if (gameOver || turn !== "w" || aiThinking) return;

      const piece = board[r][c];

      if (selected) {
        const move = legalMoves.find(
          item => item[0] === r && item[1] === c
        );

        if (move) {
          board = makeMove(board,selected,move);
          selected = null;
          legalMoves = [];

          turn = "b";
          checkGameState();
          render();

          if (!gameOver) computerMove();
          return;
        }
      }

      if (piece && colorOf(piece) === "w") {
        selected = [r,c];
        legalMoves = legalForPiece(r,c);
      } else {
        selected = null;
        legalMoves = [];
      }

      render();
    }

    function render() {
      boardElement.innerHTML = "";

      for (let r=0; r<8; r++) {
        for (let c=0; c<8; c++) {
          const square = document.createElement("button");
          square.className =
            "square " + ((r+c)%2 === 0 ? "light" : "dark");

          if (
            selected &&
            selected[0] === r &&
            selected[1] === c
          ) {
            square.classList.add("selected");
          }

          if (legalMoves.some(
            move => move[0] === r && move[1] === c
          )) {
            square.classList.add("possible");
          }

          square.textContent = symbols[board[r][c]] || "";
          square.setAttribute("aria-label",`행 ${r+1}, 열 ${c+1}`);

          square.addEventListener("click",() => handleClick(r,c));
          boardElement.appendChild(square);
        }
      }
    }

    restartButton.addEventListener("click",resetGame);

    resetGame();
  </script>
</body>
</html>
